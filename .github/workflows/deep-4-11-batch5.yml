name: Deep photo pass section 4.11 batch 5

on:
  push:
    paths:
      - ".github/workflows/deep-4-11-batch5.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: pip install -q requests beautifulsoup4 pillow
      - name: Recover images from legacy product pages
        run: |
          python3 - <<'PY'
          import json,re,io
          from pathlib import Path
          from urllib.parse import urljoin
          import requests, urllib3
          from bs4 import BeautifulSoup
          from PIL import Image
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

          S=requests.Session()
          S.headers.update({"User-Agent":"Mozilla/5.0 (compatible; KnowledgeBookImageImporter/1.0)"})

          items=[
            {"id":"4.11-флавовит","expect":["флавовит"],"page":"https://vettorg.ru/catalog/item-913.html"},
            {"id":"4.11-мексикам","expect":["мексикам"],"page":"https://www.tandem-industry.ru/catalog/?id=4033"},
            {"id":"4.11-ксиловит","expect":["ксиловит"],"page":"https://www.tandem-industry.ru/catalog/?id=5124"},
            {"id":"4.11-гель-декорнум","expect":["декорнум"],"page":"https://www.tandem-industry.ru/catalog/?folder_id=11"},
          ]

          def norm(x):
              x=(x or "").lower().replace("ё","е").replace("–","-").replace("—","-")
              x=re.sub(r'[«»"®™]',"",x)
              return re.sub(r"\s+"," ",x).strip()

          def decode_response(r):
              raw=r.content
              for enc in ("utf-8","windows-1251","cp1251"):
                  try:
                      txt=raw.decode(enc)
                      # prefer a decoding that exposes known Cyrillic text
                      if re.search(r'[А-Яа-яЁё]{4}',txt):
                          return txt
                  except: pass
              return raw.decode("utf-8","ignore")

          def collect_urls(html,sp,page,expects):
              scored=[]
              def add(u,score):
                  if not u or u.startswith("data:"): return
                  scored.append((score,urljoin(page,u)))
              for attrs in ({"property":"og:image"},{"name":"twitter:image"}):
                  m=sp.find("meta",attrs=attrs)
                  if m and m.get("content"): add(m["content"],6)
              for img in sp.find_all("img"):
                  src=img.get("data-src") or img.get("data-lazy-src") or img.get("data-original") or img.get("src")
                  alt=norm(img.get("alt","")); title=norm(img.get("title",""))
                  score=2
                  if any(norm(e) in alt or norm(e) in title for e in expects): score+=6
                  add(src,score)
              # legacy pages often use CSS/background-image rather than img tags
              for m in re.finditer(r'url\(([^)]+)\)',html,re.I):
                  u=m.group(1).strip(" \"'")
                  score=2
                  if any(norm(e).replace(" ","") in norm(u).replace(" ","") for e in expects): score+=5
                  add(u,score)
              for m in re.finditer(r'["\']([^"\']+\.(?:jpg|jpeg|png|webp))(?:\?[^"\']*)?["\']',html,re.I):
                  u=m.group(1)
                  score=2
                  if any(norm(e).replace(" ","") in norm(u).replace(" ","") for e in expects): score+=5
                  add(u,score)
              seen=set(); out=[]
              for score,u in sorted(scored,key=lambda z:z[0],reverse=True):
                  if u not in seen:
                      seen.add(u); out.append((score,u))
              return out

          def load(u,referer):
              if any(z in u.lower() for z in ("logo","favicon","icon","sprite","social","avatar","counter","captcha","banner")):
                  return None
              try:
                  r=S.get(u,timeout=45,verify=False,headers={"User-Agent":"Mozilla/5.0","Referer":referer})
                  ct=(r.headers.get("content-type") or "").split(";")[0].lower()
                  if r.status_code!=200 or not ct.startswith("image/") or len(r.content)<3000: return None
                  im=Image.open(io.BytesIO(r.content)); w,h=im.size
                  if w<160 or h<160: return None
                  return r.content,ct,w,h
              except Exception:
                  return None

          ovp=Path("data/admin-overrides.json")
          ov=json.loads(ovp.read_text(encoding="utf-8"))
          products=ov.setdefault("products",{})
          report=[]; matched=0

          for x in items:
              try:
                  pr=S.get(x["page"],timeout=60,verify=False)
                  pr.raise_for_status()
                  html=decode_response(pr)
                  sp=BeautifulSoup(html,"html.parser")
                  body=norm((sp.find("body") or sp).get_text(" ",strip=True))
                  if not any(norm(e) in body for e in x["expect"]):
                      report.append({"id":x["id"],"status":"identity-not-confirmed","page":x["page"],"body_sample":body[:400]})
                      continue
                  chosen=None; inspected=[]
                  for score,iu in collect_urls(html,sp,x["page"],x["expect"]):
                      inspected.append({"score":score,"url":iu})
                      if score<2: continue
                      z=load(iu,x["page"])
                      if z:
                          chosen=(iu,*z); break
                  if not chosen:
                      report.append({"id":x["id"],"status":"no-usable-image","page":x["page"],"candidates":inspected[:20]})
                      continue
                  iu,data,ct,w,h=chosen
                  ext={"image/png":".png","image/webp":".webp"}.get(ct,".jpg")
                  out=Path("img/photos/admin")/x["id"]/(x["id"]+"-01"+ext)
                  out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(data)
                  obj=products.setdefault(x["id"],{})
                  obj["images"]=[str(out)]; obj["__frozen"]=True
                  report.append({"id":x["id"],"status":"matched","page":x["page"],"image":iu,"path":str(out),"size":[w,h]})
                  matched+=1
              except Exception as e:
                  report.append({"id":x["id"],"status":"error","page":x["page"],"error":str(e)})

          ovp.write_text(json.dumps(ov,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          Path("data/deep-4.11-batch5-report.json").write_text(json.dumps({"matched":matched,"items":report},ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("matched",matched)
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/admin-overrides.json data/deep-4.11-batch5-report.json img/photos/admin/4.11-* 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Deep photo pass for section 4.11 batch 5"
          git pull --rebase origin main
          git push
