name: Import 4.10 product images batch 1

on:
  push:
    paths:
      - ".github/workflows/import-4-10-images.yml"

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download verified product images
        shell: bash
        run: |
          set -u
          download_optional() {
            url="$1"
            out="$2"
            mkdir -p "$(dirname "$out")"
            tmp="${out}.tmp"
            rm -f "$tmp" "$out"
            if ! curl -fL --retry 2 --retry-delay 1 --connect-timeout 15 --max-time 90 -A "Mozilla/5.0" "$url" -o "$tmp"; then
              echo "SKIP download failed: $url"
              rm -f "$tmp"
              return 0
            fi
            if [ ! -s "$tmp" ]; then
              echo "SKIP empty file: $url"
              rm -f "$tmp"
              return 0
            fi
            mime="$(file -b --mime-type "$tmp" || true)"
            case "$mime" in
              image/jpeg|image/png|image/webp)
                mv "$tmp" "$out"
                echo "OK $out ($mime)"
                ;;
              *)
                echo "SKIP unexpected MIME $mime: $url"
                rm -f "$tmp"
                ;;
            esac
          }

          download_optional "https://prok.ru/upload/iblock/76d/rs961dg5sl3r6qrk0n9vgf020fdxoxgb.jpg" "img/photos/admin/4.10-цефт-50/4.10-цефт-50-01.jpg"
          download_optional "https://xn--b1aghuag4a.xn--p1ai/wp-content/cache/image/500x500--center-5922fe1608ba33a1a4932bb03c7e3cb0.jpg" "img/photos/admin/4.10-амоксиджект-la/4.10-амоксиджект-la-01.jpg"
          download_optional "https://klm-agro.by/storage/products/June2024/medium/amoksim80.jpg" "img/photos/admin/4.10-амоксим-80/4.10-амоксим-80-01.jpg"
          download_optional "https://agrokomfort.net/image/cache/data/Uterobel-600x864.png" "img/photos/admin/4.10-утеробел/4.10-утеробел-01.png"
          download_optional "https://kupi-korm.ru/pictures/product/big/31175_big.jpg" "img/photos/admin/4.10-хелсивит/4.10-хелсивит-01.jpg"
          download_optional "https://vetq.by/wp-content/uploads/2025/01/czestivitam-zvs-500.jpg" "img/photos/admin/4.10-цефтивитам-звс/4.10-цефтивитам-звс-01.jpg"
          download_optional "https://static.tildacdn.com/tild3061-3739-4464-a436-393238633865/GM_06131_.png" "img/photos/admin/4.10-бовитаб/4.10-бовитаб-01.png"

      - name: Attach successful images to product overrides
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("data/admin-overrides.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          products = data.setdefault("products", {})
          mapping = {
              "4.10-цефт-50": "img/photos/admin/4.10-цефт-50/4.10-цефт-50-01.jpg",
              "4.10-амоксиджект-la": "img/photos/admin/4.10-амоксиджект-la/4.10-амоксиджект-la-01.jpg",
              "4.10-амоксим-80": "img/photos/admin/4.10-амоксим-80/4.10-амоксим-80-01.jpg",
              "4.10-утеробел": "img/photos/admin/4.10-утеробел/4.10-утеробел-01.png",
              "4.10-хелсивит": "img/photos/admin/4.10-хелсивит/4.10-хелсивит-01.jpg",
              "4.10-цефтивитам-звс": "img/photos/admin/4.10-цефтивитам-звс/4.10-цефтивитам-звс-01.jpg",
              "4.10-бовитаб": "img/photos/admin/4.10-бовитаб/4.10-бовитаб-01.png",
          }
          attached = []
          for product_id, image_path in mapping.items():
              if not Path(image_path).is_file():
                  continue
              product = products.setdefault(product_id, {})
              product["images"] = [image_path]
              product["__frozen"] = True
              attached.append(product_id)
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("Attached:", len(attached), attached)
          PY

      - name: Commit imported files
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/admin-overrides.json img/photos/admin/4.10-* 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No images downloaded; nothing to commit"
            exit 0
          fi
          git commit -m "Add verified product photos to section 4.10 batch 1"
          git push
