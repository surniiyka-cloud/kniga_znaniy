name: Import 4.10 product images batch 9

on:
  push:
    paths:
      - ".github/workflows/import-4-10-images.yml"

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download verified product images
        shell: bash
        run: |
          set -u
          download_optional() {
            url="$1"; out="$2"; mkdir -p "$(dirname "$out")"; tmp="${out}.tmp"; rm -f "$tmp" "$out"
            if ! curl -fL --retry 2 --retry-delay 1 --connect-timeout 15 --max-time 90 -A "Mozilla/5.0" "$url" -o "$tmp"; then echo "SKIP $url"; rm -f "$tmp"; return 0; fi
            [ -s "$tmp" ] || { rm -f "$tmp"; return 0; }
            mime="$(file -b --mime-type "$tmp" || true)"
            case "$mime" in image/jpeg|image/png|image/webp) mv "$tmp" "$out"; echo "OK $out ($mime)" ;; *) echo "SKIP MIME $mime"; rm -f "$tmp" ;; esac
          }

          download_optional "https://zoo-vet.com.ua/content/images/13/1200x1200l80br10/maz-ikhtiolovaya-10-50-g-tu-78-64884057065176.jpg" "img/photos/admin/4.10-мазь-ихтиоловая-10/4.10-мазь-ихтиоловая-10-01.jpg"
          download_optional "https://images.prom.ua/2914649273_w1280_h640_2914649273.jpg" "img/photos/admin/4.10-прогестерон-2-5/4.10-прогестерон-2-5-01.jpg"
          download_optional "https://cdn.eapteka.ru/upload/offer_photo/319/476/1_4b6f23b66b8c33a06a41c66402c2e146.png?_cvc=1775045135&t=1698872765" "img/photos/admin/4.10-натрия-хлорид-0-9-раствор/4.10-натрия-хлорид-0-9-раствор-01.png"
          download_optional "https://zoofarm67.ru/files/gallery/935/big/kof-100_1723989408.png" "img/photos/admin/4.10-кофеина-бензоат-натрия-20/4.10-кофеина-бензоат-натрия-20-01.png"
          download_optional "https://www.zaisy.ru/upload/iblock/46e/mjb2d65zqdx1afh4hs4wa78d2hdrotvg.jpeg" "img/photos/admin/4.10-борглюконат-кальция-20/4.10-борглюконат-кальция-20-01.jpeg"
          download_optional "https://planimal.ru/wa-data/public/shop/products/54/95/49554/images/49864/49864.970.jpg" "img/photos/admin/4.10-глюкоза-40-раствор-для-инъекций/4.10-глюкоза-40-раствор-для-инъекций-01.jpg"
          download_optional "https://vetpreparaty.com/content/images/36/536x536l50nn0/novokayinu-rozchin-05-200-ml-98178252991702.jpg" "img/photos/admin/4.10-новокаин-0-5/4.10-новокаин-0-5-01.jpg"

      - name: Attach successful images
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/admin-overrides.json")
          data=json.loads(p.read_text(encoding="utf-8"))
          products=data.setdefault("products",{})
          mapping={
            "4.10-мазь-ихтиоловая-10":"img/photos/admin/4.10-мазь-ихтиоловая-10/4.10-мазь-ихтиоловая-10-01.jpg",
            "4.10-прогестерон-2-5":"img/photos/admin/4.10-прогестерон-2-5/4.10-прогестерон-2-5-01.jpg",
            "4.10-натрия-хлорид-0-9-раствор":"img/photos/admin/4.10-натрия-хлорид-0-9-раствор/4.10-натрия-хлорид-0-9-раствор-01.png",
            "4.10-кофеина-бензоат-натрия-20":"img/photos/admin/4.10-кофеина-бензоат-натрия-20/4.10-кофеина-бензоат-натрия-20-01.png",
            "4.10-борглюконат-кальция-20":"img/photos/admin/4.10-борглюконат-кальция-20/4.10-борглюконат-кальция-20-01.jpeg",
            "4.10-глюкоза-40-раствор-для-инъекций":"img/photos/admin/4.10-глюкоза-40-раствор-для-инъекций/4.10-глюкоза-40-раствор-для-инъекций-01.jpg",
            "4.10-новокаин-0-5":"img/photos/admin/4.10-новокаин-0-5/4.10-новокаин-0-5-01.jpg"
          }
          for pid,img in mapping.items():
            if Path(img).is_file():
              obj=products.setdefault(pid,{})
              obj["images"]=[img]; obj["__frozen"]=True
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Commit imported files
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/admin-overrides.json img/photos/admin/4.10-* 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add verified product photos to section 4.10 batch 9"
          git push
