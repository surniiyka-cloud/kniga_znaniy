name: Import 4.10 product images batch 8

on:
  push:
    paths:
      - ".github/workflows/import-4-10-images.yml"

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download verified product images
        shell: bash
        run: |
          set -u
          download_optional() {
            url="$1"; out="$2"; mkdir -p "$(dirname "$out")"; tmp="${out}.tmp"; rm -f "$tmp" "$out"
            if ! curl -fL --retry 2 --retry-delay 1 --connect-timeout 15 --max-time 90 -A "Mozilla/5.0" "$url" -o "$tmp"; then echo "SKIP $url"; rm -f "$tmp"; return 0; fi
            [ -s "$tmp" ] || { rm -f "$tmp"; return 0; }
            mime="$(file -b --mime-type "$tmp" || true)"
            case "$mime" in image/jpeg|image/png|image/webp) mv "$tmp" "$out"; echo "OK $out ($mime)" ;; *) echo "SKIP MIME $mime"; rm -f "$tmp" ;; esac
          }

          download_optional "https://static.insales-cdn.com/r/qZ4-uvx-XvA/rs%3Afit%3A1000%3A0%3A1/q%3A100/plain/images/products/1/2832/594201360/%D0%92%D0%B8%D1%82%D0%B0%D0%BC_%D0%B4%D0%BB%D1%8F_%D0%B8%D0%BD%D1%8A%D0%B5%D0%BA%D1%86%D0%B8%D0%B9_100_%D0%BC%D0%BB.jpg%40jpg" "img/photos/admin/4.10-витам/4.10-витам-01.jpg"
          download_optional "https://pettown.ru/upload/iblock/536/0y1hyeagxi4b7aqzyaohps503snz4khb.jpg" "img/photos/admin/4.10-кабуфол-нита/4.10-кабуфол-нита-01.jpg"

      - name: Attach successful images
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/admin-overrides.json")
          data=json.loads(p.read_text(encoding="utf-8"))
          products=data.setdefault("products",{})
          mapping={
            "4.10-витам":"img/photos/admin/4.10-витам/4.10-витам-01.jpg",
            "4.10-кабуфол-нита":"img/photos/admin/4.10-кабуфол-нита/4.10-кабуфол-нита-01.jpg"
          }
          for pid,img in mapping.items():
            if Path(img).is_file():
              obj=products.setdefault(pid,{})
              obj["images"]=[img]; obj["__frozen"]=True
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Commit imported files
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/admin-overrides.json img/photos/admin/4.10-* 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add verified product photos to section 4.10 batch 8"
          git push
