name: Import 4.10 product images batch 6

on:
  push:
    paths:
      - ".github/workflows/import-4-10-images.yml"

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download verified product images
        shell: bash
        run: |
          set -u
          download_optional() {
            url="$1"; out="$2"; mkdir -p "$(dirname "$out")"; tmp="${out}.tmp"; rm -f "$tmp" "$out"
            if ! curl -fL --retry 2 --retry-delay 1 --connect-timeout 15 --max-time 90 -A "Mozilla/5.0" "$url" -o "$tmp"; then echo "SKIP $url"; rm -f "$tmp"; return 0; fi
            [ -s "$tmp" ] || { rm -f "$tmp"; return 0; }
            mime="$(file -b --mime-type "$tmp" || true)"
            case "$mime" in image/jpeg|image/png|image/webp) mv "$tmp" "$out"; echo "OK $out ($mime)" ;; *) echo "SKIP MIME $mime"; rm -f "$tmp" ;; esac
          }

          download_optional "https://farmaks.com/upload/dev2fun.imagecompress/webp/iblock/589/rx9cbxfhwotkh5r7julnrhrliyayeb81/gempotin_100ml-_1_.webp" "img/photos/admin/4.10-гемпотин-с-распылителем/4.10-гемпотин-с-распылителем-01.webp"
          download_optional "https://areal-vet.ru/image/cache/catalog/antibakterialnye/m-500x500.png" "img/photos/admin/4.10-гелерон/4.10-гелерон-01.png"
          download_optional "https://pettown.ru/upload/iblock/b24/d2hvx01826xqv42a6cxl2b8tkzk4h1cl.jpg" "img/photos/admin/4.10-бутастим-асконт/4.10-бутастим-асконт-01.jpg"
          download_optional "https://askont.ru/media/pages/101/antitoks.png" "img/photos/admin/4.10-антитокс/4.10-антитокс-01.png"

      - name: Attach successful images
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/admin-overrides.json")
          data=json.loads(p.read_text(encoding="utf-8"))
          products=data.setdefault("products",{})
          mapping={
            "4.10-гемпотин-с-распылителем":"img/photos/admin/4.10-гемпотин-с-распылителем/4.10-гемпотин-с-распылителем-01.webp",
            "4.10-гелерон":"img/photos/admin/4.10-гелерон/4.10-гелерон-01.png",
            "4.10-бутастим-асконт":"img/photos/admin/4.10-бутастим-асконт/4.10-бутастим-асконт-01.jpg",
            "4.10-антитокс":"img/photos/admin/4.10-антитокс/4.10-антитокс-01.png"
          }
          for pid,img in mapping.items():
            if Path(img).is_file():
              obj=products.setdefault(pid,{})
              obj["images"]=[img]; obj["__frozen"]=True
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Commit imported files
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/admin-overrides.json img/photos/admin/4.10-* 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add verified product photos to section 4.10 batch 6"
          git push
