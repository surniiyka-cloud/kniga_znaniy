name: Import 4.10 product images batch 4

on:
  push:
    paths:
      - ".github/workflows/import-4-10-images.yml"

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download verified product images
        shell: bash
        run: |
          set -u
          download_optional() {
            url="$1"; out="$2"; mkdir -p "$(dirname "$out")"; tmp="${out}.tmp"; rm -f "$tmp" "$out"
            if ! curl -fL --retry 2 --retry-delay 1 --connect-timeout 15 --max-time 90 -A "Mozilla/5.0" "$url" -o "$tmp"; then echo "SKIP $url"; rm -f "$tmp"; return 0; fi
            [ -s "$tmp" ] || { rm -f "$tmp"; return 0; }
            mime="$(file -b --mime-type "$tmp" || true)"
            case "$mime" in
              image/jpeg|image/png|image/webp) mv "$tmp" "$out"; echo "OK $out ($mime)" ;;
              *) echo "SKIP MIME $mime"; rm -f "$tmp" ;;
            esac
          }

          download_optional "https://apicenna.ru/upload/dev2fun.imagecompress/webp/iblock/fac/s7koxs2lpmxhhfmdy67cw00qdhrl3skh/hepatoject_100_1200x1200.webp" "img/photos/admin/4.10-гепатоджект/4.10-гепатоджект-01.webp"
          download_optional "https://pettown.ru/upload/iblock/4a1/c99pdi4lahu4r9d6m2g6ecidpw4vqgly.jpg" "img/photos/admin/4.10-йод-однохлористый/4.10-йод-однохлористый-01.jpg"
          download_optional "https://static.insales-cdn.com/r/2owfc8pLY9o/rs%3Afit%3A1000%3A0%3A1/q%3A100/plain/images/products/1/4825/780038873/3799864.jpg%40jpg" "img/photos/admin/4.10-кальция-хлорид-10-раствор-для-инъекций/4.10-кальция-хлорид-10-раствор-для-инъекций-01.jpg"
          download_optional "https://cdn.eapteka.ru/upload/offer_photo/319/711/1.jpeg?_cvc=1750782394&t=1550497275" "img/photos/admin/4.10-раствор-рингера-локка/4.10-раствор-рингера-локка-01.jpg"
          download_optional "https://vetapteka18.ru/sites/default/files/product/551286a8602494a731d70ab599a61782.jpg" "img/photos/admin/4.10-крем-зорька/4.10-крем-зорька-01.jpg"

      - name: Attach successful images
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/admin-overrides.json")
          data=json.loads(p.read_text(encoding="utf-8"))
          products=data.setdefault("products",{})
          mapping={
            "4.10-гепатоджект":"img/photos/admin/4.10-гепатоджект/4.10-гепатоджект-01.webp",
            "4.10-йод-однохлористый":"img/photos/admin/4.10-йод-однохлористый/4.10-йод-однохлористый-01.jpg",
            "4.10-кальция-хлорид-10-раствор-для-инъекций":"img/photos/admin/4.10-кальция-хлорид-10-раствор-для-инъекций/4.10-кальция-хлорид-10-раствор-для-инъекций-01.jpg",
            "4.10-раствор-рингера-локка":"img/photos/admin/4.10-раствор-рингера-локка/4.10-раствор-рингера-локка-01.jpg",
            "4.10-крем-зорька":"img/photos/admin/4.10-крем-зорька/4.10-крем-зорька-01.jpg"
          }
          for pid,img in mapping.items():
            if Path(img).is_file():
              obj=products.setdefault(pid,{})
              obj["images"]=[img]; obj["__frozen"]=True
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Commit imported files
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/admin-overrides.json img/photos/admin/4.10-* 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add verified product photos to section 4.10 batch 4"
          git push
