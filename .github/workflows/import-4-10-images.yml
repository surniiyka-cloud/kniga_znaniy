name: Import 4.10 product images batch 5

on:
  push:
    paths:
      - ".github/workflows/import-4-10-images.yml"

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download verified product images
        shell: bash
        run: |
          set -u
          download_optional() {
            url="$1"; out="$2"; mkdir -p "$(dirname "$out")"; tmp="${out}.tmp"; rm -f "$tmp" "$out"
            if ! curl -fL --retry 2 --retry-delay 1 --connect-timeout 15 --max-time 90 -A "Mozilla/5.0" "$url" -o "$tmp"; then echo "SKIP $url"; rm -f "$tmp"; return 0; fi
            [ -s "$tmp" ] || { rm -f "$tmp"; return 0; }
            mime="$(file -b --mime-type "$tmp" || true)"
            case "$mime" in
              image/jpeg|image/png|image/webp) mv "$tmp" "$out"; echo "OK $out ($mime)" ;;
              *) echo "SKIP MIME $mime"; rm -f "$tmp" ;;
            esac
          }

          download_optional "https://zooman.ru/upload/iblock/547/9lwnm8gctprcx6u6ziwvx4s3bt577lww.jpg" "img/photos/admin/4.10-метриприм/4.10-метриприм-01.jpg"
          download_optional "https://farmaks.com/upload/iblock/59d/2id8tz39tv679vxevc5ilprva79vkz88/6.jpg" "img/photos/admin/4.10-интрасан/4.10-интрасан-01.jpg"
          download_optional "https://images.prom.ua/1360317030_w700_h500_penikan-p-shprits-inzhektor.jpg" "img/photos/admin/4.10-пеникан-п-kela-бельгия/4.10-пеникан-п-kela-бельгия-01.jpg"
          download_optional "https://www.nita-farm.ru/upload/iblock/877/6icif6mouax6eekm0ilnehh49rcb4z9e.webp" "img/photos/admin/4.10-неокальф/4.10-неокальф-01.webp"

      - name: Attach successful images
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/admin-overrides.json")
          data=json.loads(p.read_text(encoding="utf-8"))
          products=data.setdefault("products",{})
          mapping={
            "4.10-метриприм":"img/photos/admin/4.10-метриприм/4.10-метриприм-01.jpg",
            "4.10-интрасан":"img/photos/admin/4.10-интрасан/4.10-интрасан-01.jpg",
            "4.10-пеникан-п-kela-бельгия":"img/photos/admin/4.10-пеникан-п-kela-бельгия/4.10-пеникан-п-kela-бельгия-01.jpg",
            "4.10-неокальф":"img/photos/admin/4.10-неокальф/4.10-неокальф-01.webp"
          }
          for pid,img in mapping.items():
            if Path(img).is_file():
              obj=products.setdefault(pid,{})
              obj["images"]=[img]; obj["__frozen"]=True
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Commit imported files
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/admin-overrides.json img/photos/admin/4.10-* 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add verified product photos to section 4.10 batch 5"
          git push
