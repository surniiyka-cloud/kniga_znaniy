name: Audit section 9.1 against Arkady list

on:
  push:
    paths:
      - ".github/workflows/audit-9-1-arkady-list.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare approved list to current section
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          from difflib import SequenceMatcher

          approved_text = """Аккумуляторный генератор холодного тумана "Good fog"
