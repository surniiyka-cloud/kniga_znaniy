Дустер аккумуляторный Gartena Twister 8L"""
          approved=[x.strip() for x in approved_text.splitlines() if x.strip()]

          book=json.loads(Path("data/book.json").read_text(encoding="utf-8"))
          sec=None
          for ch in book.get("chapters",[]):
              for s in ch.get("sections",[]):
                  if str(s.get("section") or s.get("id"))=="9.1":
                      sec=s; break
              if sec: break
          if not sec: raise SystemExit("section 9.1 not found")

          current=[]
          for t in sec.get("tables",[]):
              title=(t.get("title") or "").strip()
              if title: current.append(title)

          def norm(s):
              s=s.lower().replace("ё","е").replace("с","c")
              s=re.sub(r'[«»"“”]',"",s)
              s=s.replace("литров","л").replace("литра","л").replace("литр","л")
              s=s.replace("эл.двигатель","электр двигател").replace("электр.","электр")
              s=s.replace("бензиновый двигатель","бензин двигател")
              s=s.replace("с бензиновым двигателем","бензин двигател")
              s=s.replace("с электр двигателем","электр двигател")
              s=re.sub(r'[^a-zа-я0-9]+',' ',s)
              return re.sub(r'\s+',' ',s).strip()

          cur_norm={norm(x):x for x in current}
          app_norm={norm(x):x for x in approved}
          exact=[{"approved":app_norm[n],"current":cur_norm[n]} for n in app_norm.keys() & cur_norm.keys()]
          missing=[]; matched_cur=set(cur_norm[n] for n in app_norm.keys() & cur_norm.keys())
          matched_app=set(app_norm[n] for n in app_norm.keys() & cur_norm.keys())

          for a in approved:
              if a in matched_app: continue
              na=norm(a)
              best=None
              for c in current:
                  if c in matched_cur: continue
                  r=SequenceMatcher(None,na,norm(c)).ratio()
                  # Strong model token match gets a bonus.
                  at=set(re.findall(r'[a-z]*\d+[a-z0-9-]*|[a-z]+-[a-z0-9-]+',na))
                  ct=set(re.findall(r'[a-z]*\d+[a-z0-9-]*|[a-z]+-[a-z0-9-]+',norm(c)))
                  bonus=0.08 if at and at&ct else 0
                  score=r+bonus
                  if best is None or score>best[0]: best=(score,c)
              if best and best[0]>=0.78:
                  matched_app.add(a); matched_cur.add(best[1])
                  exact.append({"approved":a,"current":best[1],"fuzzy_score":round(best[0],3)})
              else:
                  missing.append(a)

          extra=[c for c in current if c not in matched_cur]

          # Focus on the suspicious OD-MG06 card.
          odmg=[x for x in current if "OD-MG06" in x.upper()]
          result={
            "approved_count":len(approved),
            "current_count":len(current),
            "matched_count":len(exact),
            "missing_from_current":missing,
            "extra_in_current":extra,
            "suspicious_od_mg06":odmg,
            "matches":exact
          }
          Path("data/section-9.1-arkady-audit.json").write_text(json.dumps(result,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({k:v for k,v in result.items() if k!="matches"},ensure_ascii=False,indent=2))
          PY
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/section-9.1-arkady-audit.json
          git commit -m "Audit section 9.1 against Arkady approved list"
          git pull --rebase origin main
          git push
