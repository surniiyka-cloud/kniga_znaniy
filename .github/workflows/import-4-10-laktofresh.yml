name: Import exact Laktofresh Orange photo 4.10

on:
  push:
    paths:
      - ".github/workflows/import-4-10-laktofresh.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: pip install -q requests pillow
      - name: Download exact Tian-Trade product image
        run: |
          python3 - <<'PY'
          import json,io
          from pathlib import Path
          import requests
          from PIL import Image

          pid="4.10-лактофреш-оранж"
          source_page="https://tian-trade.ru/catalog/veterinariya/veterinarnye-preparaty/kormovye-dobavki/laktofresh-oranzh/"
          image="https://tian-trade.ru/upload/iblock/8cd/2qk3xg88o1758z1blcua4f1tz3gmpvs0/WhatsApp-Image-2024_11_01-at-14.00_Photoroom.png"
          s=requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0","Referer":source_page})
          r=s.get(image,timeout=60)
          if r.status_code!=200:
              raise RuntimeError(f"image HTTP {r.status_code}")
          ct=(r.headers.get("content-type") or "").split(";")[0].lower()
          if not ct.startswith("image/") or len(r.content)<4000:
              raise RuntimeError(f"invalid image {ct} {len(r.content)}")
          im=Image.open(io.BytesIO(r.content)); w,h=im.size
          if w<180 or h<180: raise RuntimeError(f"too small {w}x{h}")
          out=Path("img/photos/admin")/pid/(pid+"-01.png")
          out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(r.content)
          ovp=Path("data/admin-overrides.json"); ov=json.loads(ovp.read_text(encoding="utf-8"))
          obj=ov.setdefault("products",{}).setdefault(pid,{})
          obj["images"]=[str(out)]; obj["__frozen"]=True
          ovp.write_text(json.dumps(ov,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          Path("data/import-4.10-laktofresh-report.json").write_text(json.dumps({
             "id":pid,"status":"matched","source_page":source_page,"image":image,"path":str(out),"size":[w,h]
          },ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/admin-overrides.json data/import-4.10-laktofresh-report.json img/photos/admin/4.10-лактофреш-оранж
          git commit -m "Add exact Laktofresh Orange photo to section 4.10"
          git pull --rebase origin main
          git push
