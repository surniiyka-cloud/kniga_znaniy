name: Проверка фронтенда v2

on:
  push:
    branches: [main, site-v2]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - '.github/workflows/frontend-check-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Проверить JavaScript
        run: |
          node --check js/app.js
          node --check js/admin.js
          node --check js/search.js
          node --check js/storage.js
          node --check js/router.js
          node --check service-worker.js
      - name: Проверить обязательные функции рендера
        run: |
          grep -q "function pairCards" js/app.js
          grep -q "function stepCards" js/app.js
          grep -q "function substanceTable" js/app.js
          grep -q "function tablePanel" js/app.js
          grep -q "function productTabs" js/app.js
          grep -q "function tabPanelHtml" js/app.js
      - name: Проверить данные
        run: |
          node -e "JSON.parse(require('fs').readFileSync('data/book.json','utf8')); JSON.parse(require('fs').readFileSync('data/assets.json','utf8')); JSON.parse(require('fs').readFileSync('data/search-index.json','utf8')); JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('JSON OK')"
      - name: Проверить обязательные файлы
        run: test -s index.html && test -s css/app.css && test -s css/admin.css && test -s js/app.js && test -s js/admin.js && test -s service-worker.js && test -s manifest.webmanifest
