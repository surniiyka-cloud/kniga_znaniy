name: Проверка фронтенда v2

on:
  push:
    branches: [site-v2]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - '.github/workflows/frontend-check-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Проверить JavaScript
        run: |
          node --check js/app.js
          node --check js/search.js
          node --check js/storage.js
          node --check js/router.js
      - name: Проверить данные
        run: |
          node -e "JSON.parse(require('fs').readFileSync('data/book.json','utf8')); JSON.parse(require('fs').readFileSync('data/assets.json','utf8')); JSON.parse(require('fs').readFileSync('data/search-index.json','utf8')); console.log('JSON OK')"
      - name: Проверить обязательные файлы
        run: test -s index.html && test -s css/app.css && test -s js/app.js
