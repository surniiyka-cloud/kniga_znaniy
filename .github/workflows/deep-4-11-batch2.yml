name: Deep photo pass section 4.11 batch 2

on:
  push:
    paths:
      - ".github/workflows/deep-4-11-batch2.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: pip install -q requests beautifulsoup4 pillow
      - name: Import exact Tandem photos
        run: |
          python3 - <<'PY'
          import json,re,io
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          import urllib3
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
          from bs4 import BeautifulSoup
          from PIL import Image

          s=requests.Session(); s.headers["User-Agent"]="Mozilla/5.0 (compatible; KnowledgeBookImageImporter/1.0)"
          items=[
            {"id":"4.11-мексикам","expect":["мексикам"],"page":"https://www.tandem-industry.ru/catalog/?id=4033"},
            {"id":"4.11-ксиловит","expect":["ксиловит"],"page":"https://www.tandem-industry.ru/catalog/?id=5124"},
            {"id":"4.11-рецеф-100","expect":["рецеф 100"],"page":"https://www.tandem-industry.ru/catalog/?id=8365"},
          ]
          def norm(x):
              x=(x or "").lower().replace("ё","е").replace("–","-").replace("—","-")
              x=re.sub(r'[«»"®™]',"",x); x=re.sub(r"\s+"," ",x)
              return x.strip()
          def candidates(sp,page,expects):
              out=[]
              for attrs in ({"property":"og:image"},{"name":"twitter:image"}):
                  m=sp.find("meta",attrs=attrs)
                  if m and m.get("content"): out.append(urljoin(page,m["content"]))
              for img in sp.find_all("img"):
                  src=img.get("data-src") or img.get("data-lazy-src") or img.get("data-original") or img.get("src")
                  if not src: continue
                  alt=norm(img.get("alt","")); title=norm(img.get("title",""))
                  u=urljoin(page,src)
                  if any(norm(e) in alt or norm(e) in title for e in expects): out.insert(0,u)
                  else: out.append(u)
              seen=[]
              for u in out:
                  if u not in seen: seen.append(u)
              return seen
          def load(u):
              if any(z in u.lower() for z in ("logo","favicon","icon","sprite","social","avatar","counter","captcha")): return None
              try:
                  r=s.get(u,timeout=60,verify=False)
                  ct=(r.headers.get("content-type") or "").split(";")[0].lower()
                  if r.status_code!=200 or not ct.startswith("image/") or len(r.content)<3500: return None
                  im=Image.open(io.BytesIO(r.content)); w,h=im.size
                  if w<180 or h<180: return None
                  return r.content,ct,w,h
              except Exception: return None

          ovp=Path("data/admin-overrides.json"); ov=json.loads(ovp.read_text(encoding="utf-8"))
          products=ov.setdefault("products",{}); rep=[]; matched=0
          for x in items:
              try:
                  pr=s.get(x["page"],timeout=60,verify=False); pr.raise_for_status()
                  sp=BeautifulSoup(pr.text,"html.parser")
                  h=sp.find("h1"); title=h.get_text(" ",strip=True) if h else ""
                  body=norm((sp.find("body") or sp).get_text(" ",strip=True))
                  if not any(norm(e) in norm(title) or norm(e) in body for e in x["expect"]):
                      rep.append({"id":x["id"],"status":"identity-not-confirmed","page":x["page"],"title":title}); continue
                  chosen=None
                  for iu in candidates(sp,x["page"],x["expect"]):
                      z=load(iu)
                      if z:
                          chosen=(iu,*z); break
                  if not chosen:
                      rep.append({"id":x["id"],"status":"no-usable-image","page":x["page"],"title":title}); continue
                  iu,data,ct,w,h=chosen
                  ext={"image/png":".png","image/webp":".webp"}.get(ct,".jpg")
                  out=Path("img/photos/admin")/x["id"]/(x["id"]+"-01"+ext)
                  out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(data)
                  obj=products.setdefault(x["id"],{}); obj["images"]=[str(out)]; obj["__frozen"]=True
                  rep.append({"id":x["id"],"status":"matched","page":x["page"],"title":title,"image":iu,"path":str(out),"size":[w,h]}); matched+=1
              except Exception as e:
                  rep.append({"id":x["id"],"status":"error","page":x["page"],"error":str(e)})
          ovp.write_text(json.dumps(ov,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          Path("data/deep-4.11-batch2-report.json").write_text(json.dumps({"matched":matched,"items":rep},ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("matched",matched)
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/admin-overrides.json data/deep-4.11-batch2-report.json img/photos/admin/4.11-* 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Deep photo pass for section 4.11 batch 2"
          git pull --rebase origin main
          git push
