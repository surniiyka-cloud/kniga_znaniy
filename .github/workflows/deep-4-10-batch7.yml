name: Deep photo pass section 4.10 batch 7

on:
  push:
    paths:
      - ".github/workflows/deep-4-10-batch7.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: pip install -q requests beautifulsoup4 pillow
      - name: Import exact Laktofresh and Orlovskaya vaccine photos
        run: |
          python3 - <<'PY'
          import json,re,io
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image

          S=requests.Session()
          S.headers.update({"User-Agent":"Mozilla/5.0 (compatible; KnowledgeBookImageImporter/1.0)"})

          items=[
            {"id":"4.10-лактофреш-оранж","expect":["лактофреш оранж"],"page":"https://agral.kz/product/%D0%BB%D0%B0%D0%BA%D1%82%D0%BE%D1%84%D1%80%D0%B5%D1%88-%D0%BE%D1%80%D0%B0%D0%BD%D0%B6-7420/"},
            {"id":"4.10-вакцина-против-сибирской-язвы-и-эмкара-орловская","expect":["орловская биофабрика","сибирской язвы","эмфизематозного карбункула"],"page":"https://instruka.top/vakczinacziya-protiv-emkara-krs-instrukcziya/"},
          ]

          def norm(x):
              x=(x or "").lower().replace("ё","е").replace("–","-").replace("—","-")
              x=re.sub(r'[«»"®™]',"",x)
              return re.sub(r"\s+"," ",x).strip()

          def candidates(sp,page,expects):
              out=[]
              for attrs in ({"property":"og:image"},{"name":"twitter:image"}):
                  m=sp.find("meta",attrs=attrs)
                  if m and m.get("content"): out.append((5,urljoin(page,m["content"])))
              for img in sp.find_all("img"):
                  src=img.get("data-src") or img.get("data-lazy-src") or img.get("data-original") or img.get("src")
                  if not src: continue
                  alt=norm(img.get("alt","")); title=norm(img.get("title",""))
                  u=urljoin(page,src)
                  score=sum(3 for e in expects if norm(e) in alt or norm(e) in title)
                  if any(k in u.lower() for k in ("lakto","fresh","orange","orlov","vaccine","vakcin","emkar","sib")): score+=2
                  out.append((score,u))
              seen=set(); ranked=[]
              for score,u in sorted(out,key=lambda z:z[0],reverse=True):
                  if u not in seen:
                      seen.add(u); ranked.append((score,u))
              return ranked

          def load(u,referer):
              if any(z in u.lower() for z in ("logo","favicon","icon","sprite","social","avatar","counter","captcha")): return None
              try:
                  r=S.get(u,timeout=60,headers={"User-Agent":"Mozilla/5.0","Referer":referer})
                  ct=(r.headers.get("content-type") or "").split(";")[0].lower()
                  if r.status_code!=200 or not ct.startswith("image/") or len(r.content)<3000: return None
                  im=Image.open(io.BytesIO(r.content)); w,h=im.size
                  if w<160 or h<160: return None
                  return r.content,ct,w,h
              except Exception:
                  return None

          ovp=Path("data/admin-overrides.json")
          ov=json.loads(ovp.read_text(encoding="utf-8"))
          products=ov.setdefault("products",{})
          report=[]; matched=0

          for x in items:
              try:
                  pr=S.get(x["page"],timeout=90); pr.raise_for_status()
                  if not pr.encoding or pr.encoding.lower()=="iso-8859-1": pr.encoding=pr.apparent_encoding
                  sp=BeautifulSoup(pr.text,"html.parser")
                  body=norm((sp.find("body") or sp).get_text(" ",strip=True))
                  if not all(norm(e) in body for e in x["expect"]):
                      report.append({"id":x["id"],"status":"identity-not-confirmed","page":x["page"]}); continue
                  chosen=None; inspected=[]
                  for score,iu in candidates(sp,x["page"],x["expect"]):
                      inspected.append({"score":score,"url":iu})
                      if score<=0: continue
                      z=load(iu,x["page"])
                      if z:
                          chosen=(iu,*z); break
                  if not chosen:
                      report.append({"id":x["id"],"status":"no-usable-image","page":x["page"],"candidates":inspected[:12]}); continue
                  iu,data,ct,w,h=chosen
                  ext={"image/png":".png","image/webp":".webp"}.get(ct,".jpg")
                  out=Path("img/photos/admin")/x["id"]/(x["id"]+"-01"+ext)
                  out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(data)
                  obj=products.setdefault(x["id"],{})
                  obj["images"]=[str(out)]; obj["__frozen"]=True
                  report.append({"id":x["id"],"status":"matched","page":x["page"],"image":iu,"path":str(out),"size":[w,h]})
                  matched+=1
              except Exception as e:
                  report.append({"id":x["id"],"status":"error","page":x["page"],"error":str(e)})

          ovp.write_text(json.dumps(ov,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          Path("data/deep-4.10-batch7-report.json").write_text(json.dumps({"matched":matched,"items":report},ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("matched",matched)
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/admin-overrides.json data/deep-4.10-batch7-report.json img/photos/admin/4.10-* 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Deep photo pass for section 4.10 batch 7"
          git pull --rebase origin main
          git push
