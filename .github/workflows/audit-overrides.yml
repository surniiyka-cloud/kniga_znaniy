name: Проверка ручных правок

on:
  push:
    branches: [main]
    paths:
      - 'data/admin-overrides.json'
      - 'data/admin-overrides.backup.json'
      - 'scripts/audit-overrides.mjs'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Проверить защищённые правки
        run: node scripts/audit-overrides.mjs
