name: Import verified Ecohimtech photos for section 4.12

on:
  push:
    paths:
      - ".github/workflows/import-4-12-ecohimtech-images.yml"

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install scraper dependencies
        run: pip install -q requests beautifulsoup4

      - name: Crawl Ecohimtech catalog and import exact section 4.12 photos
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re, time
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          import requests
          from bs4 import BeautifulSoup

          ROOT = "https://ecohimtech-ufa.ru/catalog/"
          session = requests.Session()
          session.headers.update({"User-Agent":"Mozilla/5.0 (compatible; KnowledgeBookImageImporter/1.0)"})

          def norm(s):
              s=(s or "").lower().replace("ё","е")
              s=s.replace("–","-").replace("—","-")
              s=re.sub(r'[«»"®™]',"",s)
              s=re.sub(r"\([^)]*\)"," ",s)
              s=re.sub(r"[^a-zа-я0-9%.,+\- ]+"," ",s)
              s=re.sub(r"\s+"," ",s).strip(" .,-")
              return s

          aliases = {
              "antistress horse": {"antistess horse horse health line", "antistress horse horse health line"},
              "sport horse": {"sport horse horse health line"},
              "нуклеостим водорастворимый": {"нуклеостим", "нуклеостим водорастворимый"},
              "витаспорин": {"витаспорин"},
              "нуклеопептид": {"нуклеопептид"},
              "спороветин для всех видов животных": {"спороветин"},
              "костоправ": {"костоправ"},
              "септопол": {"септопол"},
              "сангра": {"сангра"},
              "тринорм": {"тринорм"},
              "лизин": {"лизин для кошек и собак", "лизин"},
              "микровитам": {"микровитам", "витамины и аминокислоты микровитам"},
              "хондро-про": {"хондро-про"},
              "ультра-антисептик": {"ультра-антисептик"},
              "биозоль спрей": {"биозоль спрей"},
              "раносепт спрей": {"раносепт спрей", "раносепт"},
              "алюмиспрей": {"алюмиспрей"},
          }

          idx=json.loads(Path("data/search-index.json").read_text(encoding="utf-8"))
          arr=idx if isinstance(idx,list) else idx.get("items",idx.get("entries",[]))
          targets=[x for x in arr if str(x.get("section"))=="4.12"]

          def target_keys(name):
              n=norm(name)
              n=re.sub(r"\bhhl\b.*$","",n).strip()
              keys={n}
              for base, vals in aliases.items():
                  if n==base or base in n or n in base:
                      keys |= {norm(v) for v in vals}
              return keys

          target_map={}
          for x in targets:
              for k in target_keys(x.get("name","")):
                  target_map.setdefault(k,[]).append(x)

          r=session.get(ROOT,timeout=60)
          r.raise_for_status()
          soup=BeautifulSoup(r.text,"html.parser")
          urls=set()
          for a in soup.find_all("a",href=True):
              href=urljoin(ROOT,a["href"]).split("#")[0]
              p=urlparse(href)
              if p.netloc.endswith("ecohimtech-ufa.ru") and "/catalog/" in p.path and p.path.rstrip("/") != "/catalog":
                  if p.path.count("/")>=3:
                      urls.add(href)

          matched={}
          report=[]
          seen_pages=set()
          for url in sorted(urls):
              if url in seen_pages: continue
              seen_pages.add(url)
              try:
                  rr=session.get(url,timeout=50)
                  if rr.status_code!=200: continue
                  sp=BeautifulSoup(rr.text,"html.parser")
                  h1=sp.find("h1")
                  title=h1.get_text(" ",strip=True) if h1 else ""
                  nt=norm(title)
                  candidates=[]
                  for key, items in target_map.items():
                      if nt==key or nt.startswith(key+" ") or key.startswith(nt+" "):
                          candidates.extend(items)
                  if not candidates:
                      continue
                  og=sp.find("meta",attrs={"property":"og:image"})
                  img_url=urljoin(url,og.get("content")) if og and og.get("content") else None
                  if not img_url:
                      for img in sp.find_all("img"):
                          src=img.get("data-src") or img.get("src")
                          alt=norm(img.get("alt",""))
                          if src and (alt==nt or (alt and (alt in nt or nt in alt))):
                              img_url=urljoin(url,src); break
                  if not img_url:
                      report.append({"title":title,"page":url,"status":"no-image"}); continue

                  ir=session.get(img_url,timeout=60)
                  ct=(ir.headers.get("content-type") or "").split(";")[0].lower()
                  if ir.status_code!=200 or not ir.content or not ct.startswith("image/"):
                      report.append({"title":title,"page":url,"image":img_url,"status":"image-failed","http":ir.status_code,"content_type":ct}); continue
                  ext={".jpeg":".jpg"}.get(Path(urlparse(img_url).path).suffix.lower(),Path(urlparse(img_url).path).suffix.lower())
                  if ext not in (".jpg",".jpeg",".png",".webp"): ext={ "image/png":".png","image/webp":".webp" }.get(ct,".jpg")
                  if ext==".jpeg": ext=".jpg"

                  unique={x["id"]:x for x in candidates}.values()
                  for target in unique:
                      pid=target["id"]
                      out=Path("img/photos/admin")/pid/(pid+"-01"+ext)
                      out.parent.mkdir(parents=True,exist_ok=True)
                      out.write_bytes(ir.content)
                      matched[pid]=str(out)
                      report.append({"id":pid,"name":target.get("name"),"title":title,"page":url,"image":img_url,"path":str(out),"status":"matched"})
                  time.sleep(0.05)
              except Exception as e:
                  report.append({"page":url,"status":"error","error":str(e)})

          ov=Path("data/admin-overrides.json")
          data=json.loads(ov.read_text(encoding="utf-8"))
          products=data.setdefault("products",{})
          for pid,path in matched.items():
              obj=products.setdefault(pid,{})
              obj["images"]=[path]
              obj["__frozen"]=True
          ov.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          rp=Path("data/import-4.12-ecohimtech-report.json")
          rp.write_text(json.dumps({
              "section":"4.12",
              "targets":len(targets),
              "catalog_pages_checked":len(seen_pages),
              "matched":len(matched),
              "items":report
          },ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("Matched:",len(matched),"of",len(targets))
          PY

      - name: Commit imported photos
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/admin-overrides.json data/import-4.12-ecohimtech-report.json img/photos/admin/4.12-* 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No exact Ecohimtech images found"
            exit 0
          fi
          git commit -m "Import verified Ecohimtech photos for section 4.12"
          git push
