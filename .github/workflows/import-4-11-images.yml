name: Add verified Stimulong mirror photo to section 4.11
on:
  push:
    paths:
      - ".github/workflows/import-4-11-images.yml"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: pip install -q requests pillow
      - name: Import verified Stimulong image
        run: |
          python3 - <<'PY'
          import io,json
          from pathlib import Path
          import requests
          from PIL import Image
          pid="4.11-стимулонг"
          url="https://kz.sellbuy.zone/uploads/photo/102/5f38d31ddee2eeeafbbf3f2dbbe1dc25.jpeg"
          r=requests.get(url,timeout=45,headers={"User-Agent":"Mozilla/5.0","Referer":"https://kz.sellbuy.zone/"})
          r.raise_for_status()
          if not r.headers.get("content-type","").lower().startswith("image/"):
              raise RuntimeError(r.headers.get("content-type"))
          im=Image.open(io.BytesIO(r.content))
          if im.width<200 or im.height<200: raise RuntimeError("too small")
          out=Path("img/photos/admin")/pid/(pid+"-01.jpg")
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_bytes(r.content)
          p=Path("data/admin-overrides.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          d.setdefault("products",{}).setdefault(pid,{})
          d["products"][pid]["images"]=[str(out)]
          d["products"][pid]["__frozen"]=True
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("saved",im.size,len(r.content))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/admin-overrides.json img/photos/admin/4.11-стимулонг
          git diff --cached --quiet && exit 0
          git commit -m "Add verified Stimulong photo to section 4.11"
          git pull --rebase origin main
          git push
