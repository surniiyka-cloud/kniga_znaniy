name: Analyze remaining section 4.11 on Tandem

on:
  push:
    paths:
      - ".github/workflows/import-4-11-images.yml"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: pip install -q requests beautifulsoup4
      - name: Analyze exact Tandem candidates
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          from urllib.parse import urljoin,urlparse,parse_qs
          import requests
          from bs4 import BeautifulSoup
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          BASE="https://www.tandem-industry.ru"
          S=requests.Session()
          S.headers["User-Agent"]="Mozilla/5.0 (KnowledgeBook candidate analyzer)"
          retry=Retry(total=3,connect=3,read=3,backoff_factor=.8,status_forcelist=[429,500,502,503,504],allowed_methods=["GET"])
          S.mount("https://",HTTPAdapter(max_retries=retry))

          def norm(x):
              x=(x or "").lower().replace("ё","е").replace("рэн","рен").replace("–","-").replace("—","-")
              x=x.replace("«","").replace("»","").replace('"',"")
              x=re.sub(r"[^a-zа-я0-9%.,+ -]+"," ",x)
              return re.sub(r"\s+"," ",x).strip(" .,-")

          idx=json.loads(Path("data/search-index.json").read_text(encoding="utf-8"))
          arr=idx if isinstance(idx,list) else idx.get("items",idx.get("entries",[]))
          ov=json.loads(Path("data/admin-overrides.json").read_text(encoding="utf-8"))
          products=ov.get("products",{})
          targets=[x for x in arr if str(x.get("section"))=="4.11" and not products.get(x["id"],{}).get("images")]
          target_by_norm={}
          for t in targets:
              target_by_norm.setdefault(norm(t["name"]),[]).append(t)

          # Root catalog includes a broad product index. Also discover folder links and crawl them.
          seeds=[BASE+"/catalog/"]
          seen_pages=set()
          product_links={}
          for round_no in range(2):
              current=list(seeds)
              for u in current:
                  if u in seen_pages: continue
                  seen_pages.add(u)
                  try:
                      r=S.get(u,timeout=20)
                      if r.status_code!=200: continue
                      soup=BeautifulSoup(r.text,"html.parser")
                      for a in soup.find_all("a",href=True):
                          href=urljoin(r.url,a["href"]).split("#")[0]
                          txt=a.get_text(" ",strip=True)
                          if "/catalog/" not in href: continue
                          qs=parse_qs(urlparse(href).query)
                          if "id" in qs:
                              product_links[href]=txt
                          elif "folder_id" in qs and href not in seeds:
                              seeds.append(href)
                  except Exception as e:
                      print("INDEXERR",u,e)

          print("index pages",len(seen_pages),"products",len(product_links))
          result=[]
          for url,anchor in product_links.items():
              na=norm(anchor)
              possible=[]
              for nt,ts in target_by_norm.items():
                  if nt==na or nt in na or na in nt:
                      possible.extend(ts)
              if not possible:
                  continue
              try:
                  r=S.get(url,timeout=20)
                  if r.status_code!=200: continue
                  soup=BeautifulSoup(r.text,"html.parser")
                  h1=soup.find("h1")
                  title=h1.get_text(" ",strip=True) if h1 else anchor
                  page_text=soup.get_text(" ",strip=True)
                  imgs=[]
                  og=soup.find("meta",property="og:image")
                  if og and og.get("content"): imgs.append(urljoin(r.url,og["content"]))
                  for im in soup.find_all("img"):
                      src=im.get("data-src") or im.get("data-lazy-src") or im.get("src")
                      if src:
                          src=urljoin(r.url,src)
                          if src not in imgs: imgs.append(src)
                  for t in possible:
                      result.append({
                          "id":t["id"],"name":t["name"],"url":url,"anchor":anchor,"title":title,
                          "rubikon":"рубикон" in page_text.lower().replace("ё","е"),
                          "images":[x for x in imgs if not any(z in x.lower() for z in ["logo","icon","sprite","banner"])][:12]
                      })
              except Exception as e:
                  print("DETAILERR",url,e)

          out={"targets":len(targets),"indexed_products":len(product_links),"candidates":result}
          Path("data/import-4.11-tandem-candidates.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({"targets":len(targets),"indexed_products":len(product_links),"candidates":len(result)},ensure_ascii=False))
          PY
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/import-4.11-tandem-candidates.json
          git diff --cached --quiet && exit 0
          git commit -m "Analyze Tandem candidates for remaining section 4.11 photos"
          git pull --rebase origin main
          git push
