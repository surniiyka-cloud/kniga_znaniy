name: Analyze VetFarmGarant photos for section 4.11

on:
  push:
    paths:
      - ".github/workflows/import-4-11-images.yml"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: pip install -q requests beautifulsoup4
      - name: Scrape Rubikon catalog candidates
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,time
          from pathlib import Path
          from urllib.parse import urljoin
          from difflib import SequenceMatcher
          import requests
          from bs4 import BeautifulSoup

          BASE="https://www.vetfarmgarant.ru"
          session=requests.Session()
          session.headers.update({"User-Agent":"Mozilla/5.0 (compatible; KnowledgeBookImageImporter/1.3)"})

          def norm(x):
              x=(x or "").lower().replace("ё","е").replace("–","-").replace("—","-")
              x=re.sub(r'[«»"\']',"",x).replace("-"," ")
              x=re.sub(r"[^a-zа-я0-9%.,+ ]+"," ",x)
              x=re.sub(r"\s+"," ",x).strip(" .,-")
              return x

          def nums(x):
              return re.findall(r"\d+(?:[.,]\d+)?",norm(x))

          idx=json.loads(Path("data/search-index.json").read_text(encoding="utf-8"))
          arr=idx if isinstance(idx,list) else idx.get("items",idx.get("entries",[]))
          targets=[x for x in arr if str(x.get("section"))=="4.11"]

          links=set()
          for page in range(1,15):
              url=f"{BASE}/catalog/?PAGEN_1={page}&arrFilter_7_1159954462=Y&set_filter=y"
              try:
                  r=session.get(url,timeout=45)
                  if r.status_code!=200: continue
                  soup=BeautifulSoup(r.text,"html.parser")
                  before=len(links)
                  for a in soup.find_all("a",href=True):
                      href=urljoin(BASE,a["href"])
                      txt=norm(a.get_text(" ",strip=True))
                      if "/catalog/" in href and href.rstrip("/")!=url.rstrip("/") and txt:
                          links.add(href.split("?")[0].split("#")[0])
                  print("page",page,"links",len(links)-before)
              except Exception as e:
                  print("catalog error",page,e)

          products=[]
          seen=set()
          for u in sorted(links):
              if u in seen: continue
              seen.add(u)
              try:
                  r=session.get(u,timeout=40)
                  if r.status_code!=200: continue
                  soup=BeautifulSoup(r.text,"html.parser")
                  h1=soup.find("h1")
                  title=h1.get_text(" ",strip=True) if h1 else ""
                  if not title: continue
                  text=soup.get_text(" ",strip=True)
                  if "руби" not in text.lower(): continue

                  imgs=[]
                  for img in soup.find_all("img"):
                      src=img.get("data-src") or img.get("data-lazy-src") or img.get("src")
                      if not src: continue
                      src=urljoin(u,src)
                      low=src.lower()
                      if any(z in low for z in ["logo","icon","sprite","no-image","no_img","placeholder"]): continue
                      alt=img.get("alt","")
                      if src.startswith("http"):
                          imgs.append({"src":src,"alt":alt})
                  products.append({"title":title,"url":u,"text":text[:2000],"images":imgs[:12]})
              except Exception:
                  pass
              time.sleep(0.03)

          suggestions=[]
          for t in targets:
              tn=norm(t["name"])
              tn_nums=nums(tn)
              cand=[]
              for p in products:
                  pn=norm(p["title"])
                  if nums(pn)!=tn_nums: continue
                  score=SequenceMatcher(None,tn,pn).ratio()
                  if tn==pn: score=1
                  elif tn in pn or pn in tn: score=max(score,0.94)
                  if score>=0.72:
                      cand.append({"title":p["title"],"url":p["url"],"score":round(score,3),"images":p["images"]})
              cand=sorted(cand,key=lambda z:z["score"],reverse=True)[:5]
              suggestions.append({"id":t["id"],"name":t["name"],"numbers":tn_nums,"candidates":cand})

          Path("data/import-4.11-vetfarm-candidates.json").write_text(
              json.dumps({"targets":len(targets),"pages_scanned":14,"product_pages":len(products),"suggestions":suggestions},ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8"
          )
          print("product pages",len(products),"targets with candidates",sum(bool(x["candidates"]) for x in suggestions))
          PY
      - name: Commit candidate report
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/import-4.11-vetfarm-candidates.json
          git commit -m "Analyze VetFarmGarant image candidates for section 4.11"
          git push
