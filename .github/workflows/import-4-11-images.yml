name: Import verified Tandem photos 4.11

on:
  push:
    paths:
      - ".github/workflows/import-4-11-images.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: pip install -q requests beautifulsoup4 pillow
      - name: Import exact Tandem cards
        shell: bash
        run: |
          python3 - <<'PY'
          import io,json
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          pages={
            "4.11-мексикам":("Мексикам","https://www.tandem-industry.ru/catalog/?id=4033"),
            "4.11-рецеф-100":("Рецеф 100","https://www.tandem-industry.ru/catalog/?id=8365"),
            "4.11-ксиловит":("Ксиловит","https://www.tandem-industry.ru/catalog/?id=5124")
          }
          S=requests.Session()
          import urllib3
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
          S.headers.update({"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36"})
          S.mount("https://",HTTPAdapter(max_retries=Retry(total=4,connect=4,read=4,backoff_factor=.8,status_forcelist=[429,500,502,503,504],allowed_methods=["GET"])))
          p=Path("data/admin-overrides.json"); data=json.loads(p.read_text(encoding="utf-8")); P=data.setdefault("products",{})
          report=[]
          for pid,(expected,url) in pages.items():
            if P.get(pid,{}).get("images"):
              report.append({"id":pid,"status":"already"}); continue
            try:
              r=S.get(url,timeout=25,verify=False); r.raise_for_status()
              q=BeautifulSoup(r.text,"html.parser")
              h1=q.find("h1"); title=h1.get_text(" ",strip=True) if h1 else ""
              page_text=q.get_text(" ",strip=True)
              if expected.lower() not in page_text.lower():
                report.append({"id":pid,"status":"name-not-found","title":title}); continue
              imgs=[]
              m=q.find("meta",property="og:image")
              if m and m.get("content"): imgs.append(urljoin(r.url,m["content"]))
              for im in q.find_all("img"):
                src=im.get("data-src") or im.get("data-lazy-src") or im.get("data-original") or im.get("src")
                if src:
                  src=urljoin(r.url,src)
                  if src not in imgs: imgs.append(src)
              chosen=None
              for iu in imgs:
                lo=iu.lower()
                if any(z in lo for z in ["logo","icon","sprite","banner","placeholder","noimage","favicon"]): continue
                try:
                  ir=S.get(iu,timeout=25,headers={"Referer":url},verify=False)
                  if ir.status_code!=200 or len(ir.content)<5000: continue
                  if not ir.headers.get("content-type","").lower().startswith("image/"): continue
                  im=Image.open(io.BytesIO(ir.content)); w,h=im.size
                  if w<180 or h<180 or w/h>4 or h/w>4: continue
                  ext={"jpeg":".jpg","jpg":".jpg","png":".png","webp":".webp"}.get((im.format or "").lower())
                  if not ext: continue
                  chosen=(iu,ir.content,ext,w,h); break
                except Exception: pass
              if not chosen:
                report.append({"id":pid,"status":"no-image","title":title,"images":imgs[:10]}); continue
              iu,blob,ext,w,h=chosen
              out=Path("img/photos/admin")/pid/(pid+"-01"+ext); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(blob)
              P.setdefault(pid,{})["images"]=[str(out)]; P[pid]["__frozen"]=True
              report.append({"id":pid,"status":"imported","title":title,"image":iu,"path":str(out),"size":[w,h]})
              print("IMPORTED",pid,iu,w,h)
            except Exception as e:
              report.append({"id":pid,"status":"error","error":str(e)})
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          Path("data/import-4.11-tandem-exact-report.json").write_text(json.dumps({"items":report},ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(report,ensure_ascii=False))
          PY
      - name: Commit
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/admin-overrides.json data/import-4.11-tandem-exact-report.json img/photos/admin/4.11-* || true
          git diff --cached --quiet && exit 0
          git commit -m "Import exact Tandem photos for section 4.11"
          git pull --rebase origin main
          git push
