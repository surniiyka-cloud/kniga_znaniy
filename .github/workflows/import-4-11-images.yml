name: Inspect exact Tandem pages for remaining 4.11 photos
on:
  push:
    paths:
      - ".github/workflows/import-4-11-images.yml"
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests beautifulsoup4 pillow
      - name: Inspect exact pages
        run: |
          python3 - <<'PY'
          import io,json
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          from PIL import Image
          pages={
            "4.11-мексикам":"https://www.tandem-industry.ru/catalog/?id=4033",
            "4.11-рецеф-100":"https://www.tandem-industry.ru/catalog/?id=8365",
            "4.11-стимулонг":"https://www.tandem-industry.ru/catalog/?id=5122",
            "4.11-ксиловит":"https://www.tandem-industry.ru/catalog/?id=5124"
          }
          S=requests.Session(); S.headers["User-Agent"]="Mozilla/5.0"
          report={}
          for pid,page in pages.items():
            r=S.get(page,timeout=40,verify=False)
            soup=BeautifulSoup(r.text,"html.parser")
            found=[]
            for im in soup.find_all("img"):
              src=im.get("data-zoom-image") or im.get("data-large") or im.get("data-src") or im.get("src")
              if not src: continue
              u=urljoin(r.url,src)
              low=u.lower()
              if any(z in low for z in ["logo","icon","sprite","counter","captcha","banner"]): continue
              try:
                ir=S.get(u,timeout=30,verify=False,headers={"Referer":page})
                if ir.status_code!=200 or len(ir.content)<5000: continue
                if not ir.headers.get("content-type","").lower().startswith("image/"): continue
                I=Image.open(io.BytesIO(ir.content))
                if I.width<180 or I.height<180: continue
                found.append({"url":u,"w":I.width,"h":I.height,"bytes":len(ir.content),"alt":im.get("alt",""),"title":im.get("title","")})
              except Exception: pass
            report[pid]={"page":page,"title":soup.title.get_text(" ",strip=True) if soup.title else "","images":found}
          open("data/import-4.11-tandem-exact-inspect.json","w",encoding="utf-8").write(json.dumps(report,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/import-4.11-tandem-exact-inspect.json
          git diff --cached --quiet && exit 0
          git commit -m "Inspect exact Tandem images for remaining 4.11 cards"
          git pull --rebase origin main
          git push
