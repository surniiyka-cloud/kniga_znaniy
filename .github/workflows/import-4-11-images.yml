name: Section 4.11 exact alias photo pass

on:
  push:
    paths:
      - ".github/workflows/import-4-11-images.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - run: pip install -q requests beautifulsoup4 pillow

      - name: Import exact alias matches
        shell: bash
        run: |
          python3 - <<'PY'
          import io,json
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image

          mapping = {
            "4.11-амоксициллин-10": "https://biopromgarant.ru/catalog/krupnyy-rogatyy-skot/amoksitsillin-10-poroshok/",
            "4.11-биовит-р-150": "https://biopromgarant.ru/catalog/krupnyy-rogatyy-skot/biovit-r-150-poroshok/",
            "4.11-норфлоксацин-никотинат-20": "https://biopromgarant.ru/catalog/krupnyy-rogatyy-skot/norfloksatsina-nikotinat-20/",
            "4.11-рецеф-4-0": "https://biopromgarant.ru/catalog/krupnyy-rogatyy-skot/retsef-4-0-poroshok/",
            "4.11-рецеф-50": "https://biopromgarant.ru/catalog/krupnyy-rogatyy-skot/retsef-5-rastvor/",
            "4.11-роксилонг-300": "https://biopromgarant.ru/catalog/krupnyy-rogatyy-skot/roksilong-300/",
            "4.11-рефкином-2-5": "https://biopromgarant.ru/catalog/krupnyy-rogatyy-skot/refkinom-2-5-i-7-5/",
            "4.11-рефкином-7-5": "https://biopromgarant.ru/catalog/krupnyy-rogatyy-skot/refkinom-2-5-i-7-5/"
          }

          s=requests.Session()
          s.headers["User-Agent"]="Mozilla/5.0 (KnowledgeBook exact image importer)"
          p=Path("data/admin-overrides.json")
          data=json.loads(p.read_text(encoding="utf-8"))
          products=data.setdefault("products",{})

          # Remove a false fuzzy assignment: Trimetoks tablets != Trimetoks T powder.
          if "4.11-триметокс" in products:
              products["4.11-триметокс"]["images"]=[]
              products["4.11-триметокс"]["__frozen"]=True

          report=[]
          for pid,url in mapping.items():
              try:
                  r=s.get(url,timeout=20)
                  r.raise_for_status()
              except Exception as e:
                  report.append({"id":pid,"page":url,"status":"page-error","error":str(e)})
                  continue
              soup=BeautifulSoup(r.text,"html.parser")
              text=soup.get_text(" ",strip=True).lower().replace("ё","е")
              if "производитель: рубикон" not in text and "производитель рубикон" not in text:
                  raise RuntimeError(f"Rubikon not confirmed for {pid}: {url}")

              imgs=[]
              og=soup.find("meta",property="og:image")
              if og and og.get("content"):
                  imgs.append(urljoin(r.url,og["content"]))
              # Prefer images from the product detail region / large images.
              for im in soup.find_all("img"):
                  src=im.get("data-src") or im.get("data-lazy-src") or im.get("src")
                  if src:
                      imgs.append(urljoin(r.url,src))

              chosen=None
              for iu in imgs:
                  low=iu.lower()
                  if any(z in low for z in ["logo","icon","sprite","banner","placeholder","nophoto","no-photo","loader"]):
                      continue
                  try:
                      ir=s.get(iu,timeout=20)
                      if ir.status_code!=200 or len(ir.content)<7000:
                          continue
                      if not ir.headers.get("content-type","").lower().startswith("image/"):
                          continue
                      im=Image.open(io.BytesIO(ir.content))
                      w,h=im.size
                      if w<240 or h<240 or w/h>3.3 or h/w>3.3:
                          continue
                      fmt=(im.format or "").lower()
                      ext={"jpeg":".jpg","jpg":".jpg","png":".png","webp":".webp"}.get(fmt)
                      if not ext:
                          continue
                      chosen=(iu,ir.content,ext)
                      break
                  except Exception:
                      continue

              if not chosen:
                  report.append({"id":pid,"page":url,"status":"no-usable-image"})
                  continue

              iu,blob,ext=chosen
              out=Path("img/photos/admin")/pid/(pid+"-01"+ext)
              out.parent.mkdir(parents=True,exist_ok=True)
              out.write_bytes(blob)
              products.setdefault(pid,{})
              products[pid]["images"]=[str(out)]
              products[pid]["__frozen"]=True
              report.append({"id":pid,"page":url,"image":iu,"path":str(out),"status":"imported"})

          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          Path("data/import-4.11-alias-report.json").write_text(
              json.dumps({"items":report},ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(report,ensure_ascii=False))
          PY

      - name: Commit
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/admin-overrides.json data/import-4.11-alias-report.json img/photos/admin/4.11-* || true
          git diff --cached --quiet && exit 0
          git commit -m "Add exact alias-matched photos for section 4.11"
          git pull --rebase origin main
          git push
