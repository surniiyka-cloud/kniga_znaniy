name: Import exact Trimetoks photo 4.11
on:
  push:
    paths:
      - ".github/workflows/import-4-11-images.yml"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: pip install -q requests pillow
      - name: Import image
        run: |
          python3 - <<'PY'
          import io,json
          from pathlib import Path
          import requests
          from PIL import Image
          pid="4.11-триметокс"
          page="https://agrokomfort.net/index.php?route=product/product&product_id=463"
          url="https://agrokomfort.net/image/cache/data/rubikon/-%D0%A2%D1%80%D0%B8%D0%BC%D0%B5%D1%82%D0%BE%D0%BA%D1%81%20%D1%82%D0%B0%D0%B1-300x432.jpg"
          r=requests.get(url,timeout=30,headers={"User-Agent":"Mozilla/5.0","Referer":page})
          r.raise_for_status()
          im=Image.open(io.BytesIO(r.content))
          if im.width<200 or im.height<200: raise RuntimeError("small image")
          out=Path("img/photos/admin")/pid/(pid+"-01.jpg")
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_bytes(r.content)
          p=Path("data/admin-overrides.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          d.setdefault("products",{}).setdefault(pid,{})
          d["products"][pid]["images"]=[str(out)]
          d["products"][pid]["__frozen"]=True
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(out,im.size)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/admin-overrides.json img/photos/admin
          git diff --cached --quiet && exit 0
          git commit -m "Add exact Trimetoks tablets photo"
          git pull --rebase origin main
          git push
