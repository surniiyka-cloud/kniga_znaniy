name: Import verified 4.11 product photos batch 3

on:
  push:
    paths:
      - ".github/workflows/import-4-11-images.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download exact official images
        shell: bash
        run: |
          set -e
          mkdir -p "img/photos/admin/4.11-тайфун" "img/photos/admin/4.11-микофарм"
          curl -fL --retry 3 -A "Mozilla/5.0" "https://rubikon-agro.com/images/tayfun.JPG" -o "img/photos/admin/4.11-тайфун/4.11-тайфун-01.jpg"
          curl -fL --retry 3 -A "Mozilla/5.0" "https://rubikon-agro.com/images/prep/microfarm.JPG" -o "img/photos/admin/4.11-микофарм/4.11-микофарм-01.jpg"
          file "img/photos/admin/4.11-тайфун/4.11-тайфун-01.jpg"
          file "img/photos/admin/4.11-микофарм/4.11-микофарм-01.jpg"
      - name: Attach
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/admin-overrides.json")
          data=json.loads(p.read_text(encoding="utf-8"))
          products=data.setdefault("products",{})
          mapping={
            "4.11-тайфун":"img/photos/admin/4.11-тайфун/4.11-тайфун-01.jpg",
            "4.11-микофарм":"img/photos/admin/4.11-микофарм/4.11-микофарм-01.jpg"
          }
          for pid,img in mapping.items():
              obj=products.setdefault(pid,{})
              obj["images"]=[img]
              obj["__frozen"]=True
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/admin-overrides.json img/photos/admin/4.11-тайфун img/photos/admin/4.11-микофарм
          git commit -m "Add official Tayfun and Mikofarm photos to section 4.11"
          git push
