name: Add verified Rubikon photo to section 4.11

on:
  push:
    paths:
      - ".github/workflows/import-4-11-images.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download verified Roksilong 300 photo
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import json,requests
          from pathlib import Path
          url="https://www.vetfarmgarant.ru/upload/iblock/83c/83c8c511280b8f105c96edf1d1b410a1.png"
          pid="4.11-роксилонг-300"
          out=Path("img/photos/admin")/pid/(pid+"-01.png")
          out.parent.mkdir(parents=True,exist_ok=True)
          r=requests.get(url,timeout=60,headers={"User-Agent":"Mozilla/5.0"})
          r.raise_for_status()
          if not r.headers.get("content-type","").lower().startswith("image/"):
              raise RuntimeError("Source is not an image")
          out.write_bytes(r.content)

          p=Path("data/admin-overrides.json")
          data=json.loads(p.read_text(encoding="utf-8"))
          data.setdefault("products",{})[pid]={
              "images":[str(out)],
              "__frozen":True
          }
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("saved",out,len(r.content))
          PY

      - name: Commit verified image
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/admin-overrides.json img/photos/admin/4.11-роксилонг-300/4.11-роксилонг-300-01.png
          git diff --cached --quiet && exit 0
          git commit -m "Add verified Roksilong 300 photo to section 4.11"
          git push
