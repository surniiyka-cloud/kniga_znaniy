name: Import exact Tian Trade 4.11 photo set

on:
  push:
    paths:
      - ".github/workflows/import-4-11-images.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: pip install -q requests beautifulsoup4 pillow
      - name: Import exact Tian Trade pages
        shell: bash
        run: |
          python3 - <<'PY'
          import io,json,re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          pages={
            "4.11-ксиловит":"https://tian-trade.ru/catalog/veterinariya/veterinarnye-preparaty/prochie-preparaty/ksilovit-inekts/",
            "4.11-стимулонг":"https://tian-trade.ru/catalog/veterinariya/veterinarnye-preparaty/narushenie-obmena-veshchestv/stimulong-inekts/",
            "4.11-руфферан-200-плюс":"https://tian-trade.ru/catalog/veterinariya/veterinarnye-preparaty/narushenie-obmena-veshchestv/rufferan-200-plyus-inekts/",
            "4.11-витамикс-1":"https://tian-trade.ru/catalog/veterinariya/veterinarnye-preparaty/narushenie-obmena-veshchestv/vitamiks-1-poroshok/",
            "4.11-витасорб":"https://tian-trade.ru/catalog/veterinariya/veterinarnye-preparaty/narushenie-obmena-veshchestv/vitasorb-poroshok/",
            "4.11-биосан":"https://tian-trade.ru/catalog/veterinariya/veterinarnye-preparaty/antisepticheskie-i-dezsredstva/biosan-osushitel-podstilka/"
          }
          expected={
            "4.11-ксиловит":"ксиловит",
            "4.11-стимулонг":"стимулонг",
            "4.11-руфферан-200-плюс":"руфферан-200 плюс",
            "4.11-витамикс-1":"витамикс-1",
            "4.11-витасорб":"витасорб",
            "4.11-биосан":"биосан"
          }
          S=requests.Session(); S.headers["User-Agent"]="Mozilla/5.0"
          retry=Retry(total=4,connect=4,read=4,backoff_factor=.8,status_forcelist=[429,500,502,503,504],allowed_methods=["GET"])
          S.mount("https://",HTTPAdapter(max_retries=retry))
          def norm(x):
              x=(x or "").lower().replace("ё","е").replace("–","-").replace("—","-")
              x=x.replace("«","").replace("»","").replace('"',"")
              x=re.sub(r"\b(инъекц|порошок|осушитель|подстилка)\.?\b"," ",x)
              return re.sub(r"\s+"," ",re.sub(r"[^a-zа-я0-9%.,+ -]+"," ",x)).strip(" .,-()")

          p=Path("data/admin-overrides.json"); data=json.loads(p.read_text(encoding="utf-8")); products=data.setdefault("products",{})
          report=[]
          for pid,url in pages.items():
              try:
                  r=S.get(url,timeout=25); r.raise_for_status()
                  q=BeautifulSoup(r.text,"html.parser"); h1=q.find("h1"); title=h1.get_text(" ",strip=True) if h1 else ""
                  if expected[pid] not in norm(title):
                      report.append({"id":pid,"status":"title-mismatch","title":title,"page":url}); continue
                  imgs=[]
                  og=q.find("meta",property="og:image")
                  if og and og.get("content"): imgs.append(urljoin(r.url,og["content"]))
                  for im in q.find_all("img"):
                      src=im.get("data-src") or im.get("data-lazy-src") or im.get("data-original") or im.get("src")
                      if src:
                          src=urljoin(r.url,src)
                          if src not in imgs: imgs.append(src)
                  chosen=None
                  for iu in imgs:
                      lo=iu.lower()
                      if any(z in lo for z in ["logo","icon","sprite","banner","placeholder","favicon"]): continue
                      try:
                          ir=S.get(iu,timeout=25)
                          if ir.status_code!=200 or len(ir.content)<7000 or not ir.headers.get("content-type","").lower().startswith("image/"): continue
                          im=Image.open(io.BytesIO(ir.content)); w,h=im.size
                          if w<240 or h<240 or w/h>3.5 or h/w>3.5: continue
                          ext={"jpeg":".jpg","jpg":".jpg","png":".png","webp":".webp"}.get((im.format or "").lower())
                          if not ext: continue
                          chosen=(iu,ir.content,ext); break
                      except Exception: pass
                  if not chosen:
                      report.append({"id":pid,"status":"no-image","title":title,"page":url}); continue
                  iu,blob,ext=chosen
                  out=Path("img/photos/admin")/pid/(pid+"-01"+ext); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(blob)
                  products.setdefault(pid,{})["images"]=[str(out)]; products[pid]["__frozen"]=True
                  report.append({"id":pid,"status":"imported","title":title,"page":url,"image":iu,"path":str(out)})
                  print("IMPORTED",pid,iu)
              except Exception as e:
                  report.append({"id":pid,"status":"error","page":url,"error":str(e)})
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          Path("data/import-4.11-tian-exact-report.json").write_text(json.dumps({"items":report},ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(report,ensure_ascii=False))
          PY
      - name: Commit
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/admin-overrides.json data/import-4.11-tian-exact-report.json img/photos/admin/4.11-* || true
          git diff --cached --quiet && exit 0
          git commit -m "Import exact Tian Trade photo set for section 4.11"
          git pull --rebase origin main
          git push
