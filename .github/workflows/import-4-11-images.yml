name: Import exact Rubikon photos for section 4.11

on:
  push:
    paths:
      - ".github/workflows/import-4-11-images.yml"

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install scraper dependencies
        run: pip install -q requests beautifulsoup4

      - name: Find exact Rubikon product photos and download them
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re, time
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          MANUFACTURERS = [
              "https://vetsnab.info/proizvoditeli/rubikon-respublika-belarus/",
              "https://vetsnab.info/proizvoditeli/ooo-rubikon/",
          ]
          session = requests.Session()
          session.headers.update({"User-Agent":"Mozilla/5.0 (compatible; KnowledgeBookImageImporter/1.0)"})

          def norm(s):
              s = (s or "").lower().replace("ё","е")
              s = s.replace("–","-").replace("—","-")
              s = re.sub(r'[«»"\']', "", s)
              s = re.sub(r"\\s+", " ", s)
              s = s.replace("-", " ")\n              s = re.sub(r"[^a-zа-я0-9%.,+ ]+", " ", s)
              s = re.sub(r"\\s+", " ", s).strip(" .,-")
              return s

          def ext_from(resp, url):
              ct=(resp.headers.get("content-type") or "").split(";")[0].lower()
              if ct=="image/png": return ".png"
              if ct=="image/webp": return ".webp"
              if ct in ("image/jpeg","image/jpg"): return ".jpg"
              low=url.lower().split("?")[0]
              for e in (".png",".webp",".jpg",".jpeg"):
                  if low.endswith(e): return ".jpg" if e==".jpeg" else e
              return ".jpg"

          idx=json.loads(Path("data/search-index.json").read_text(encoding="utf-8"))
          arr=idx if isinstance(idx,list) else idx.get("items", idx.get("entries", []))
          targets=[x for x in arr if str(x.get("section"))=="4.11"]
          by_norm={}
          for x in targets:
              by_norm.setdefault(norm(x.get("name")),[]).append(x)

          product_urls=set()
          for src in MANUFACTURERS:
              r=session.get(src,timeout=40)
              r.raise_for_status()
              soup=BeautifulSoup(r.text,"html.parser")
              for a in soup.find_all("a",href=True):
                  href=urljoin(src,a["href"])
                  if "/vetpreparaty/" in href:
                      product_urls.add(href.split("#")[0])

          print("Candidate product pages:",len(product_urls))
          matched={}
          report=[]

          for url in sorted(product_urls):
              try:
                  r=session.get(url,timeout=40)
                  r.raise_for_status()
                  soup=BeautifulSoup(r.text,"html.parser")
                  h1=soup.find("h1")
                  title=h1.get_text(" ",strip=True) if h1 else ""
                  nt=norm(title)
                  if nt not in by_norm:
                      continue
                  text=soup.get_text(" ",strip=True).lower()
                  if "руби" not in text:
                      continue

                  img_url=None
                  og=soup.find("meta",attrs={"property":"og:image"})
                  if og and og.get("content"):
                      img_url=urljoin(url,og["content"])
                  if not img_url:
                      for img in soup.find_all("img"):
                          alt=norm(img.get("alt",""))
                          if alt==nt and img.get("src"):
                              img_url=urljoin(url,img["src"])
                              break
                  if not img_url:
                      report.append({"name":title,"url":url,"status":"no-image"})
                      continue

                  ir=session.get(img_url,timeout=60)
                  if ir.status_code!=200 or not ir.content:
                      report.append({"name":title,"url":url,"image":img_url,"status":"image-failed"})
                      continue
                  ct=(ir.headers.get("content-type") or "").lower()
                  if "image/" not in ct:
                      report.append({"name":title,"url":url,"image":img_url,"status":"not-image","content_type":ct})
                      continue

                  for target in by_norm[nt]:
                      pid=target["id"]
                      ext=ext_from(ir,img_url)
                      out=Path("img/photos/admin")/pid/(pid+"-01"+ext)
                      out.parent.mkdir(parents=True,exist_ok=True)
                      out.write_bytes(ir.content)
                      matched[pid]=str(out)
                      report.append({"id":pid,"name":target["name"],"page":url,"image":img_url,"path":str(out),"status":"matched"})
                  time.sleep(0.05)
              except Exception as e:
                  report.append({"url":url,"status":"error","error":str(e)})

          ov=Path("data/admin-overrides.json")
          data=json.loads(ov.read_text(encoding="utf-8"))
          products=data.setdefault("products",{})
          for pid,path in matched.items():
              obj=products.setdefault(pid,{})
              obj["images"]=[path]
              obj["__frozen"]=True
          ov.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\\n",encoding="utf-8")

          rp=Path("data/import-4.11-images-report.json")
          rp.write_text(json.dumps({
              "targets":len(targets),
              "candidate_pages":len(product_urls),
              "matched":len(matched),
              "items":report
          },ensure_ascii=False,indent=2)+"\\n",encoding="utf-8")
          print("Matched exact products:",len(matched))
          PY

      - name: Commit imported photos
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/admin-overrides.json data/import-4.11-images-report.json img/photos/admin/4.11-* 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No exact images found"
            exit 0
          fi
          git commit -m "Import exact Rubikon product photos for section 4.11"
          git push
