name: Analyze Rubikon photo candidates for section 4.11

on:
  push:
    paths:
      - ".github/workflows/import-4-11-images.yml"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: pip install -q requests beautifulsoup4
      - name: Build safe candidate map
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,time
          from pathlib import Path
          from urllib.parse import urljoin
          from difflib import SequenceMatcher
          import requests
          from bs4 import BeautifulSoup

          SOURCES=[
            "https://vetsnab.info/proizvoditeli/rubikon-respublika-belarus/",
            "https://vetsnab.info/proizvoditeli/ooo-rubikon/",
          ]
          s=requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0 (compatible; KnowledgeBookImageImporter/1.2)"})

          def norm(x):
              x=(x or "").lower().replace("ё","е").replace("–","-").replace("—","-")
              x=re.sub(r'[«»"\']',"",x).replace("-"," ")
              x=re.sub(r"[^a-zа-я0-9%.,+ ]+"," ",x)
              return re.sub(r"\s+"," ",x).strip(" .,-")

          def nums(x):
              return re.findall(r"\d+(?:[.,]\d+)?", norm(x))

          idx=json.loads(Path("data/search-index.json").read_text(encoding="utf-8"))
          arr=idx if isinstance(idx,list) else idx.get("items",idx.get("entries",[]))
          targets=[x for x in arr if str(x.get("section"))=="4.11"]

          urls=set()
          for src in SOURCES:
              r=s.get(src,timeout=40); r.raise_for_status()
              soup=BeautifulSoup(r.text,"html.parser")
              for a in soup.find_all("a",href=True):
                  u=urljoin(src,a["href"])
                  if "/vetpreparaty/" in u: urls.add(u.split("#")[0])

          pages=[]
          for u in sorted(urls):
              try:
                  r=s.get(u,timeout=40); r.raise_for_status()
                  soup=BeautifulSoup(r.text,"html.parser")
                  h1=soup.find("h1")
                  title=h1.get_text(" ",strip=True) if h1 else ""
                  imgs=[]
                  for img in soup.find_all("img"):
                      src=img.get("src") or img.get("data-src") or img.get("data-lazy-src")
                      if not src: continue
                      src=urljoin(u,src)
                      if "logo" in src.lower(): continue
                      alt=img.get("alt","")
                      if alt or "/uploads/" in src:
                          imgs.append({"alt":alt,"src":src})
                  pages.append({"title":title,"url":u,"images":imgs[:8]})
              except Exception:
                  pass

          suggestions=[]
          for t in targets:
              tn=norm(t["name"])
              best=[]
              for p in pages:
                  pn=norm(p["title"])
                  if not pn: continue
                  n1,n2=nums(tn),nums(pn)
                  if n1!=n2: continue
                  score=SequenceMatcher(None,tn,pn).ratio()
                  if tn in pn or pn in tn: score=max(score,0.93)
                  if score>=0.62:
                      best.append({"title":p["title"],"url":p["url"],"score":round(score,3),"images":p["images"]})
              best=sorted(best,key=lambda z:z["score"],reverse=True)[:5]
              suggestions.append({"id":t["id"],"name":t["name"],"numbers":nums(tn),"candidates":best})

          Path("data/import-4.11-candidates.json").write_text(
              json.dumps({"targets":len(targets),"pages":len(pages),"suggestions":suggestions},ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8"
          )
          print("targets",len(targets),"pages",len(pages))
          PY
      - name: Commit candidate report
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/import-4.11-candidates.json
          git commit -m "Analyze Rubikon image candidates for section 4.11"
          git push
