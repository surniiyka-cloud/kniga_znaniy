name: Import remaining 4.11 photos from Tian Trade

on:
  push:
    paths:
      - ".github/workflows/import-4-11-images.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: pip install -q requests beautifulsoup4 pillow
      - name: Import exact catalog cards
        shell: bash
        run: |
          python3 - <<'PY'
          import io,json,re,xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import urljoin,urlparse
          from concurrent.futures import ThreadPoolExecutor,as_completed
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          BASE="https://tian-trade.ru"
          S=requests.Session()
          S.headers["User-Agent"]="Mozilla/5.0 (KnowledgeBook image sync)"
          retry=Retry(total=3,connect=3,read=3,backoff_factor=.8,status_forcelist=[429,500,502,503,504],allowed_methods=["GET"])
          S.mount("https://",HTTPAdapter(max_retries=retry))

          def norm(x):
              x=(x or "").lower().replace("ё","е").replace("–","-").replace("—","-")
              x=x.replace("«","").replace("»","").replace('"',"")
              x=re.sub(r"\b(инъекц|инъекционный|инъекционная|порошок|раствор|суспензия|таблетки|гранулят)\.?\b"," ",x)
              x=re.sub(r"[^a-zа-я0-9%.,+ -]+"," ",x)
              return re.sub(r"\s+"," ",x).strip(" .,-")

          idx=json.loads(Path("data/search-index.json").read_text(encoding="utf-8"))
          arr=idx if isinstance(idx,list) else idx.get("items",idx.get("entries",[]))
          ovp=Path("data/admin-overrides.json")
          ov=json.loads(ovp.read_text(encoding="utf-8"))
          products=ov.setdefault("products",{})
          targets=[x for x in arr if str(x.get("section"))=="4.11" and not products.get(x["id"],{}).get("images")]
          target_norm={t["id"]:norm(t["name"]) for t in targets}

          # Discover sitemaps from robots plus common paths.
          sitemap_urls=set()
          try:
              rr=S.get(BASE+"/robots.txt",timeout=15)
              for line in rr.text.splitlines():
                  if line.lower().startswith("sitemap:"):
                      sitemap_urls.add(line.split(":",1)[1].strip())
          except Exception: pass
          sitemap_urls.update([BASE+"/sitemap.xml",BASE+"/sitemap_index.xml",BASE+"/sitemap-index.xml"])

          seen_maps=set(); urls=set()
          def parse_map(u):
              if u in seen_maps: return
              seen_maps.add(u)
              try:
                  r=S.get(u,timeout=20)
                  if r.status_code!=200 or not r.text.strip(): return
                  root=ET.fromstring(r.content)
                  locs=[el.text.strip() for el in root.iter() if el.tag.lower().endswith("loc") and el.text]
                  for loc in locs:
                      if loc.lower().endswith(".xml") or "sitemap" in urlparse(loc).path.lower():
                          if loc not in seen_maps: parse_map(loc)
                      elif "/catalog/" in loc:
                          urls.add(loc)
              except Exception as e:
                  print("MAPERR",u,e)

          for sm in list(sitemap_urls):
              parse_map(sm)

          # Fallback: search product links from category entry pages.
          if not urls:
              seeds=[BASE+"/catalog/",BASE+"/catalog/veterinariya/",BASE+"/catalog/veterinariya/veterinarnye-preparaty/"]
              for u in seeds:
                  try:
                      r=S.get(u,timeout=20)
                      q=BeautifulSoup(r.text,"html.parser")
                      for a in q.find_all("a",href=True):
                          h=urljoin(r.url,a["href"]).split("#")[0]
                          if "/catalog/" in h: urls.add(h)
                  except Exception: pass

          print("catalog urls",len(urls),"remaining targets",len(targets))

          def inspect(url):
              try:
                  r=S.get(url,timeout=15)
                  if r.status_code!=200: return None
                  q=BeautifulSoup(r.text,"html.parser")
                  h1=q.find("h1")
                  title=h1.get_text(" ",strip=True) if h1 else ""
                  if not title: return None
                  nt=norm(title)
                  matched=[t for t in targets if target_norm[t["id"]]==nt]
                  if not matched: return None
                  text=q.get_text(" ",strip=True)
                  imgs=[]
                  og=q.find("meta",property="og:image")
                  if og and og.get("content"): imgs.append(urljoin(r.url,og["content"]))
                  for im in q.find_all("img"):
                      src=im.get("data-src") or im.get("data-lazy-src") or im.get("data-original") or im.get("src")
                      if src:
                          src=urljoin(r.url,src)
                          if src not in imgs: imgs.append(src)
                  return (url,title,text,imgs,matched)
              except Exception:
                  return None

          pages=[]
          with ThreadPoolExecutor(max_workers=12) as ex:
              futs=[ex.submit(inspect,u) for u in urls]
              for f in as_completed(futs):
                  v=f.result()
                  if v: pages.append(v)

          report=[]; added=0
          # Some cards intentionally duplicate the same product; exact names may match more than one target.
          for url,title,text,imgs,matched in pages:
              for t in matched:
                  pid=t["id"]
                  if products.get(pid,{}).get("images"): continue
                  chosen=None
                  for iu in imgs:
                      lo=iu.lower()
                      if any(z in lo for z in ["logo","icon","sprite","banner","placeholder","no-photo","nophoto","favicon"]): continue
                      try:
                          ir=S.get(iu,timeout=15)
                          if ir.status_code!=200 or len(ir.content)<7000: continue
                          if not ir.headers.get("content-type","").lower().startswith("image/"): continue
                          im=Image.open(io.BytesIO(ir.content)); w,h=im.size
                          if w<240 or h<240 or w/h>3.5 or h/w>3.5: continue
                          ext={"jpeg":".jpg","jpg":".jpg","png":".png","webp":".webp"}.get((im.format or "").lower())
                          if not ext: continue
                          chosen=(iu,ir.content,ext); break
                      except Exception: continue
                  if not chosen:
                      report.append({"id":pid,"name":t["name"],"page":url,"title":title,"status":"exact-page-no-image"})
                      continue
                  iu,blob,ext=chosen
                  out=Path("img/photos/admin")/pid/(pid+"-01"+ext)
                  out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(blob)
                  products.setdefault(pid,{})
                  products[pid]["images"]=[str(out)]
                  products[pid]["__frozen"]=True
                  report.append({"id":pid,"name":t["name"],"page":url,"title":title,"image":iu,"path":str(out),"status":"imported"})
                  added+=1
                  print("IMPORTED",t["name"],url,iu)

          ovp.write_text(json.dumps(ov,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          remaining=[t for t in targets if not products.get(t["id"],{}).get("images")]
          out={"source":"tian-trade.ru","catalog_urls":len(urls),"exact_pages":len(pages),"added":added,
               "items":report,"remaining":[{"id":t["id"],"name":t["name"]} for t in remaining]}
          Path("data/import-4.11-tian-report.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({"catalog_urls":len(urls),"exact_pages":len(pages),"added":added,"remaining":len(remaining)},ensure_ascii=False))
          PY

      - name: Commit
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/admin-overrides.json data/import-4.11-tian-report.json img/photos/admin/4.11-* || true
          git diff --cached --quiet && exit 0
          git commit -m "Import exact Tian Trade photos for section 4.11"
          git pull --rebase origin main
          git push
