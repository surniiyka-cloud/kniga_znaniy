name: Complete section 4.11 verified photos

on:
  push:
    paths:
      - ".github/workflows/import-4-11-images.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - run: pip install -q requests beautifulsoup4 pillow

      - name: Crawl BiopromGarant and import exact Rubikon images
        shell: bash
        run: |
          python3 - <<'PY'
          import io,json,re,time
          from pathlib import Path
          from urllib.parse import urljoin,urlparse
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image

          BASE="https://biopromgarant.ru"
          s=requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0 (compatible; KnowledgeBook/4.11-complete)"})

          def norm(x):
              x=(x or "").lower().replace("ё","е").replace("–","-").replace("—","-")
              x=x.replace("«","").replace("»","").replace('"',"")
              x=x.replace("рэн","рен")
              x=re.sub(r"\bпорошок\b|\bраствор\b|\bсуспензия\b|\bтаблетки\b|\bдля инъекций\b"," ",x)
              x=re.sub(r"[^a-zа-я0-9%.,+ -]+"," ",x)
              return re.sub(r"\s+"," ",x).strip(" .,-")

          def nums(x):
              return re.findall(r"\d+(?:[.,]\d+)?", (x or "").replace("%",""))

          idx=json.loads(Path("data/search-index.json").read_text(encoding="utf-8"))
          arr=idx if isinstance(idx,list) else idx.get("items",idx.get("entries",[]))
          targets=[x for x in arr if str(x.get("section"))=="4.11"]

          ovp=Path("data/admin-overrides.json")
          ov=json.loads(ovp.read_text(encoding="utf-8"))
          products=ov.setdefault("products",{})

          # Crawl catalog pagination
          product_urls=set()
          for page in range(1,31):
              urls=[
                BASE+f"/catalog/?PAGEN_1={page}",
                BASE+f"/catalog/?PAGEN_2={page}",
              ]
              for url in urls:
                  try:
                      r=s.get(url,timeout=30)
                      if r.status_code!=200: continue
                      soup=BeautifulSoup(r.text,"html.parser")
                      for a in soup.find_all("a",href=True):
                          href=urljoin(r.url,a["href"]).split("#")[0]
                          p=urlparse(href).path
                          if "/catalog/" not in p: continue
                          if "PAGEN_" in href: continue
                          # product-ish URLs only
                          if p.rstrip("/") != "/catalog":
                              product_urls.add(href)
                  except Exception as e:
                      print("catalog err",url,e)

          print("discovered",len(product_urls),"urls")

          # Build candidate page data
          pages=[]
          for i,url in enumerate(sorted(product_urls)):
              try:
                  r=s.get(url,timeout=30)
                  if r.status_code!=200: continue
                  soup=BeautifulSoup(r.text,"html.parser")
                  h1=soup.find("h1")
                  title=h1.get_text(" ",strip=True) if h1 else ""
                  if not title: continue
                  text=soup.get_text(" ",strip=True)
                  nt=norm(title)
                  if not nt: continue

                  imgs=[]
                  og=soup.find("meta",property="og:image")
                  if og and og.get("content"): imgs.append(urljoin(r.url,og["content"]))
                  for im in soup.find_all("img"):
                      src=im.get("data-src") or im.get("data-lazy-src") or im.get("src")
                      if src: imgs.append(urljoin(r.url,src))
                  pages.append((url,title,nt,text,imgs))
              except Exception as e:
                  print("page err",url,e)
              if i%50==0: print("scanned",i)

          def score(tname,pname):
              a=norm(tname); b=norm(pname)
              if a==b: return 100
              if a in b or b in a:
                  # require all numeric modifiers from target
                  na=nums(a); nb=nums(b)
                  if na and any(n not in nb for n in na): return 0
                  return 85
              # word overlap, strict
              wa=set(a.split()); wb=set(b.split())
              if wa and len(wa & wb)/len(wa)>=0.9:
                  na=nums(a); nb=nums(b)
                  if na and any(n not in nb for n in na): return 0
                  return 75
              return 0

          report=[]
          imported=0
          for t in targets:
              pid=t["id"]; name=t["name"]
              if products.get(pid,{}).get("images"):
                  report.append({"id":pid,"name":name,"status":"already"})
                  continue

              ranked=[]
              for page in pages:
                  sc=score(name,page[1])
                  if sc>=75:
                      # Require Rubikon context if present on page;
                      # catalog itself is mixed, so do not import without it.
                      txt=page[3].lower().replace("ё","е")
                      if "ру-бикон" in txt: txt=txt.replace("ру-бикон","рубикон")
                      if "рубикон" not in txt:
                          continue
                      ranked.append((sc,page))
              ranked.sort(key=lambda x:-x[0])
              if not ranked:
                  report.append({"id":pid,"name":name,"status":"no-match"})
                  continue
              # Avoid ambiguity: top must be unique by score/title
              top=ranked[0]
              if len(ranked)>1 and ranked[1][0]==top[0] and norm(ranked[1][1][1])!=norm(top[1][1]):
                  report.append({"id":pid,"name":name,"status":"ambiguous","candidates":[x[1][1] for x in ranked[:3]]})
                  continue

              sc,(url,title,nt,text,imgs)=top
              chosen=None; data=None; ext=None
              for iu in imgs:
                  low=iu.lower()
                  if any(x in low for x in ["logo","icon","sprite","no-photo","nophoto","placeholder","loader","banner"]):
                      continue
                  try:
                      ir=s.get(iu,timeout=30)
                      if ir.status_code!=200 or len(ir.content)<7000: continue
                      if not ir.headers.get("content-type","").lower().startswith("image/"): continue
                      im=Image.open(io.BytesIO(ir.content)); w,h=im.size
                      if w<250 or h<250 or w/h>3.2 or h/w>3.2: continue
                      fmt=(im.format or "").lower()
                      ext={"jpeg":".jpg","jpg":".jpg","png":".png","webp":".webp"}.get(fmt)
                      if not ext: continue
                      chosen=iu; data=ir.content
                      break
                  except Exception:
                      pass
              if not chosen:
                  report.append({"id":pid,"name":name,"status":"matched-no-image","page":url,"page_title":title})
                  continue

              out=Path("img/photos/admin")/pid/(pid+"-01"+ext)
              out.parent.mkdir(parents=True,exist_ok=True)
              out.write_bytes(data)
              products.setdefault(pid,{})
              products[pid]["images"]=[str(out)]
              products[pid]["__frozen"]=True
              imported+=1
              report.append({"id":pid,"name":name,"status":"imported","page":url,"page_title":title,"image":chosen,"path":str(out),"score":sc})
              print("IMPORTED",name,"<-",title,chosen)

          ovp.write_text(json.dumps(ov,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          summary={
              "source":"biopromgarant.ru",
              "targets":len(targets),
              "pages":len(pages),
              "imported":imported,
              "already":sum(x["status"]=="already" for x in report),
              "no_match":sum(x["status"]=="no-match" for x in report),
              "matched_no_image":sum(x["status"]=="matched-no-image" for x in report),
              "ambiguous":sum(x["status"]=="ambiguous" for x in report),
              "items":report
          }
          Path("data/import-4.11-bioprom-report.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({k:summary[k] for k in ["targets","pages","imported","already","no_match","matched_no_image","ambiguous"]},ensure_ascii=False))
          PY

      - name: Commit completed imports
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/admin-overrides.json data/import-4.11-bioprom-report.json img/photos/admin/4.11-* || true
          git diff --cached --quiet && exit 0
          git commit -m "Complete verified Rubikon photos for section 4.11"
          git push
