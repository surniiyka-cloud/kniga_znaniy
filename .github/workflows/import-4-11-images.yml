name: Import exact Rubikon photos for section 4.11

on:
  push:
    paths:
      - ".github/workflows/import-4-11-images.yml"

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install scraper dependencies
        run: pip install -q requests beautifulsoup4

      - name: Clean previous 4.11 auto-import and fetch exact product images
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re, shutil, time
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          MANUFACTURERS = [
              "https://vetsnab.info/proizvoditeli/rubikon-respublika-belarus/",
              "https://vetsnab.info/proizvoditeli/ooo-rubikon/",
          ]
          session=requests.Session()
          session.headers.update({"User-Agent":"Mozilla/5.0 (compatible; KnowledgeBookImageImporter/1.1)"})

          def norm(s):
              s=(s or "").lower().replace("ё","е").replace("–","-").replace("—","-")
              s=re.sub(r'[«»"\']',"",s)
              s=s.replace("-"," ")
              s=re.sub(r"[^a-zа-я0-9%.,+ ]+"," ",s)
              s=re.sub(r"\s+"," ",s).strip(" .,-")
              return s

          def ext_from(resp,url):
              ct=(resp.headers.get("content-type") or "").split(";")[0].lower()
              if ct=="image/png": return ".png"
              if ct=="image/webp": return ".webp"
              return ".jpg"

          idx=json.loads(Path("data/search-index.json").read_text(encoding="utf-8"))
          arr=idx if isinstance(idx,list) else idx.get("items",idx.get("entries",[]))
          targets=[x for x in arr if str(x.get("section"))=="4.11"]
          by_norm={}
          for x in targets:
              by_norm.setdefault(norm(x.get("name")),[]).append(x)

          # Remove everything created by the previous automatic 4.11 pass.
          admin=Path("img/photos/admin")
          for p in admin.glob("4.11-*"):
              if p.is_dir():
                  shutil.rmtree(p)
              elif p.exists():
                  p.unlink()

          ov=Path("data/admin-overrides.json")
          data=json.loads(ov.read_text(encoding="utf-8"))
          products=data.setdefault("products",{})
          for x in targets:
              pid=x["id"]
              if pid in products and "images" in products[pid]:
                  products[pid].pop("images",None)

          product_urls=set()
          for src in MANUFACTURERS:
              r=session.get(src,timeout=40); r.raise_for_status()
              soup=BeautifulSoup(r.text,"html.parser")
              for a in soup.find_all("a",href=True):
                  href=urljoin(src,a["href"])
                  if "/vetpreparaty/" in href:
                      product_urls.add(href.split("#")[0])

          matched={}
          report=[]
          for url in sorted(product_urls):
              try:
                  r=session.get(url,timeout=40); r.raise_for_status()
                  soup=BeautifulSoup(r.text,"html.parser")
                  h1=soup.find("h1")
                  title=h1.get_text(" ",strip=True) if h1 else ""
                  nt=norm(title)
                  if nt not in by_norm:
                      continue
                  page_text=soup.get_text(" ",strip=True).lower()
                  if "ооо «рубикон»" not in page_text and "ооо \"рубикон\"" not in page_text and "руби" not in page_text:
                      continue

                  img_url=None
                  # ONLY accept an image whose ALT exactly matches the product title.
                  for img in soup.find_all("img"):
                      alt=norm(img.get("alt",""))
                      src=img.get("src") or img.get("data-src") or img.get("data-lazy-src")
                      if alt==nt and src:
                          candidate=urljoin(url,src)
                          if "logo" in candidate.lower():
                              continue
                          img_url=candidate
                          break

                  if not img_url:
                      report.append({"name":title,"page":url,"status":"no-exact-product-image"})
                      continue

                  ir=session.get(img_url,timeout=60)
                  ct=(ir.headers.get("content-type") or "").lower()
                  if ir.status_code!=200 or not ir.content or "image/" not in ct:
                      report.append({"name":title,"page":url,"image":img_url,"status":"image-failed"})
                      continue

                  for target in by_norm[nt]:
                      pid=target["id"]
                      ext=ext_from(ir,img_url)
                      out=Path("img/photos/admin")/pid/(pid+"-01"+ext)
                      out.parent.mkdir(parents=True,exist_ok=True)
                      out.write_bytes(ir.content)
                      products.setdefault(pid,{})["images"]=[str(out)]
                      products[pid]["__frozen"]=True
                      matched[pid]=str(out)
                      report.append({"id":pid,"name":target["name"],"page":url,"image":img_url,"path":str(out),"status":"matched"})
                  time.sleep(0.04)
              except Exception as e:
                  report.append({"page":url,"status":"error","error":str(e)})

          ov.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          Path("data/import-4.11-images-report.json").write_text(
              json.dumps({"targets":len(targets),"candidate_pages":len(product_urls),"matched":len(matched),"items":report},ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8"
          )
          print("Matched exact product images:",len(matched))
          PY

      - name: Commit corrected imported photos
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/admin-overrides.json data/import-4.11-images-report.json img/photos/admin
          git commit -m "Correct section 4.11 Rubikon product photo import"
          git push

# rerun after JSON repair
