name: Analyze official Rubikon photos for section 4.11

on:
  push:
    paths:
      - ".github/workflows/import-4-11-images.yml"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - run: pip install -q requests beautifulsoup4

      - name: Crawl official Rubikon site and match section 4.11
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,time
          from pathlib import Path
          from urllib.parse import urljoin,urlparse
          from difflib import SequenceMatcher
          import requests
          from bs4 import BeautifulSoup

          BASES=["https://rubikonvet.by","http://rubikonvet.by"]
          s=requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0 (compatible; KnowledgeBookImageImporter/2.0)"})

          def norm(x):
              x=(x or "").lower().replace("ё","е").replace("–","-").replace("—","-")
              x=re.sub(r'[«»"\']',"",x).replace("-"," ")
              x=re.sub(r"[^a-zа-я0-9%.,+ ]+"," ",x)
              return re.sub(r"\s+"," ",x).strip(" .,-")

          def nums(x):
              return re.findall(r"\d+(?:[.,]\d+)?",norm(x))

          idx=json.loads(Path("data/search-index.json").read_text(encoding="utf-8"))
          arr=idx if isinstance(idx,list) else idx.get("items",idx.get("entries",[]))
          targets=[x for x in arr if str(x.get("section"))=="4.11"]
          by_norm={norm(x["name"]):x for x in targets}

          def fetch(url):
              try:
                  r=s.get(url,timeout=30,allow_redirects=True)
                  if r.status_code==200 and "text/html" in r.headers.get("content-type","text/html"):
                      return r
              except Exception:
                  return None

          # Discover links from homepage, sitemap(s) and a shallow crawl.
          seeds=[]
          live_base=None
          for base in BASES:
              r=fetch(base+"/")
              if r:
                  live_base=base
                  seeds.append(base+"/")
                  for sm in ["/sitemap.xml","/sitemap_index.xml"]:
                      try:
                          x=s.get(base+sm,timeout=20)
                          if x.status_code==200:
                              for loc in re.findall(r"<loc>(.*?)</loc>",x.text,re.I|re.S):
                                  seeds.append(loc.strip())
                      except Exception:
                          pass
                  break

          pages=[]
          seen=set()
          q=list(dict.fromkeys(seeds))
          max_pages=500
          while q and len(seen)<max_pages:
              url=q.pop(0)
              if url in seen: continue
              seen.add(url)
              r=fetch(url)
              if not r: continue
              soup=BeautifulSoup(r.text,"html.parser")
              title=(soup.find("h1") or soup.find("title"))
              title=title.get_text(" ",strip=True) if title else ""
              text=soup.get_text(" ",strip=True)
              imgs=[]
              for im in soup.find_all("img"):
                  src=im.get("data-src") or im.get("data-lazy-src") or im.get("src")
                  if not src: continue
                  src=urljoin(r.url,src)
                  low=src.lower()
                  if any(z in low for z in ["logo","icon","sprite","captcha","placeholder","no-image"]): continue
                  if src.startswith("http"):
                      imgs.append({"src":src,"alt":im.get("alt","")})
              pages.append({"url":r.url,"title":title,"text":text[:5000],"images":imgs[:30]})

              # shallow same-domain crawl
              if live_base and len(seen)<220:
                  host=urlparse(live_base).netloc
                  for a in soup.find_all("a",href=True):
                      href=urljoin(r.url,a["href"]).split("#")[0]
                      if urlparse(href).netloc==host and href not in seen and href not in q:
                          if not re.search(r"\.(pdf|docx?|xlsx?|zip|jpg|jpeg|png|webp)$",href,re.I):
                              q.append(href)

          suggestions=[]
          for t in targets:
              tn=norm(t["name"]); ns=nums(tn); cand=[]
              for p in pages:
                  pn=norm(p["title"])
                  if not pn: continue
                  if ns and nums(pn)!=ns: continue
                  score=SequenceMatcher(None,tn,pn).ratio()
                  if tn==pn: score=1
                  elif tn in pn or pn in tn: score=max(score,.94)
                  # Require Rubikon context and product-like image.
                  if score<.76: continue
                  ctx=norm(p["text"])
                  if "рубикон" not in ctx and "rubikon" not in ctx: continue
                  good=[]
                  for im in p["images"]:
                      a=norm(im.get("alt","")); u=im.get("src","")
                      if tn in a or a in tn or score>=.94:
                          good.append(im)
                  if good:
                      cand.append({"title":p["title"],"url":p["url"],"score":round(score,3),"images":good[:10]})
              cand=sorted(cand,key=lambda x:x["score"],reverse=True)[:5]
              suggestions.append({"id":t["id"],"name":t["name"],"numbers":ns,"candidates":cand})

          report={
              "source":"rubikonvet.by",
              "live_base":live_base,
              "targets":len(targets),
              "pages_scanned":len(pages),
              "matched_targets":sum(bool(x["candidates"]) for x in suggestions),
              "suggestions":suggestions
          }
          Path("data/import-4.11-official-candidates.json").write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({k:report[k] for k in ["live_base","targets","pages_scanned","matched_targets"]},ensure_ascii=False))
          PY

      - name: Commit official-source report
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/import-4.11-official-candidates.json
          git diff --cached --quiet && exit 0
          git commit -m "Analyze official Rubikon images for section 4.11"
          git push
