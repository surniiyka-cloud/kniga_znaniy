name: Analyze Agrokomfort for remaining 4.11

on:
  push:
    paths:
      - ".github/workflows/import-4-11-images.yml"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: pip install -q requests beautifulsoup4
      - name: Analyze exact remaining products
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          from urllib.parse import urljoin, urlparse, parse_qs
          import requests
          from bs4 import BeautifulSoup
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          BASE="https://agrokomfort.net"
          S=requests.Session(); S.headers["User-Agent"]="Mozilla/5.0"
          S.mount("https://",HTTPAdapter(max_retries=Retry(total=3,backoff_factor=.6,status_forcelist=[429,500,502,503,504],allowed_methods=["GET"])))

          def norm(x):
              x=(x or "").lower().replace("ё","е").replace("–","-").replace("—","-")
              x=x.replace("«","").replace("»","").replace('"',"")
              x=re.sub(r"[^a-zа-я0-9%.,+ -]+"," ",x)
              return re.sub(r"\s+"," ",x).strip(" .,-")

          idx=json.loads(Path("data/search-index.json").read_text(encoding="utf-8"))
          arr=idx if isinstance(idx,list) else idx.get("items",idx.get("entries",[]))
          ov=json.loads(Path("data/admin-overrides.json").read_text(encoding="utf-8"))
          P=ov.get("products",{})
          targets=[x for x in arr if str(x.get("section"))=="4.11" and not P.get(x["id"],{}).get("images")]
          nt={t["id"]:norm(t["name"]) for t in targets}

          product_urls=set()
          # Crawl every category page found in home/catalog navigation and broad search pagination.
          seeds=[BASE+"/"]
          for page in range(1,20):
              seeds.append(BASE+f"/index.php?filter_tag=&limit=100&page={page}&route=product%2Fsearch")
          # Known categories used by site.
          for path in range(50,101):
              seeds.append(BASE+f"/index.php?path={path}&route=product%2Fcategory&limit=100")

          for u in seeds:
              try:
                  r=S.get(u,timeout=12)
                  if r.status_code!=200: continue
                  q=BeautifulSoup(r.text,"html.parser")
                  for a in q.find_all("a",href=True):
                      h=urljoin(r.url,a["href"])
                      qs=parse_qs(urlparse(h).query)
                      if "product_id" in qs and ("product/product" in h or "route=product" in h):
                          product_urls.add(h)
              except Exception: pass

          print("products",len(product_urls))
          candidates=[]
          for u in product_urls:
              try:
                  r=S.get(u,timeout=12)
                  if r.status_code!=200: continue
                  q=BeautifulSoup(r.text,"html.parser"); h1=q.find("h1")
                  title=h1.get_text(" ",strip=True) if h1 else ""
                  if not title: continue
                  ntitle=norm(title)
                  matched=[t for t in targets if nt[t["id"]]==ntitle or nt[t["id"]] in ntitle or ntitle in nt[t["id"]]]
                  if not matched: continue
                  text=q.get_text(" ",strip=True)
                  imgs=[]
                  m=q.find("meta",property="og:image")
                  if m and m.get("content"): imgs.append(urljoin(r.url,m["content"]))
                  for im in q.find_all("img"):
                      src=im.get("data-src") or im.get("data-lazy-src") or im.get("src")
                      if src:
                          src=urljoin(r.url,src)
                          if src not in imgs: imgs.append(src)
                  for t in matched:
                      candidates.append({"id":t["id"],"name":t["name"],"title":title,"url":u,
                                         "rubikon":"рубикон" in norm(text),
                                         "images":[x for x in imgs if not any(z in x.lower() for z in ["logo","icon","sprite","banner"])][:10]})
              except Exception: pass

          out={"targets":len(targets),"products":len(product_urls),"candidates":candidates}
          Path("data/import-4.11-agrokomfort-candidates.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({"targets":len(targets),"products":len(product_urls),"candidates":len(candidates)},ensure_ascii=False))
          PY
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/import-4.11-agrokomfort-candidates.json
          git diff --cached --quiet && exit 0
          git commit -m "Analyze Agrokomfort candidates for remaining section 4.11"
          git pull --rebase origin main
          git push
