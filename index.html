<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#335D42">
  <meta name="description" content="Книга знаний ТИАН-Трейд — единая внутренняя база товаров и решений.">
  <title>Книга знаний · ТИАН-Трейд</title>
  <link rel="icon" type="image/svg+xml" href="./assets/brand/favicon.svg">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./css/app.css?v=2.2.70">
  <link rel="stylesheet" href="./css/admin.css?v=2.2.70">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Навигация по книге">
      <div class="brand compact-brand">
        <button class="brand-home" id="brandHome" type="button" aria-label="На главную">
          <span class="brand-home-icon" aria-hidden="true">⌂</span>
          <span class="brand-home-text">Главная</span>
        </button>
        <button class="icon-btn mobile-only" id="closeSidebar" type="button" aria-label="Закрыть меню">×</button>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <a class="diag-link" href="#/diagnostics" hidden>Диагностика данных</a>
        <button class="version-link" id="versionLogBtn" type="button" hidden>ver. <span id="versionNumber">2.0</span> log</button>
        <span id="syncState" class="sync-state">Загрузка данных…</span>
      </div>
    </aside>

    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <div class="workspace">
      <section class="brand-banner" aria-label="ТИАН-Трейд — Книга знаний">
        <button class="brand-banner-home" type="button" data-route="home" aria-label="На главную">
          <span class="brand-banner-copy">
            <strong>ТИАН-ТРЕЙД</strong>
            <b>КНИГА ЗНАНИЙ</b>
          </span>
          <img src="./assets/brand/favicon.svg" alt="" aria-hidden="true">
        </button>
      </section>
      <header class="topbar">
        <button class="icon-btn mobile-only" id="openSidebar" type="button" aria-label="Открыть меню">☰</button>
        <div class="search-wrap">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="globalSearch" class="search-input" type="search"
                 placeholder="Название, артикул, назначение…"
                 autocomplete="off" spellcheck="false">
          <kbd>Ctrl K</kbd>
          <div id="searchPanel" class="search-panel" hidden></div>
        </div>
        <div class="top-actions">
          <button class="text-btn kb-admin-top" id="kbAdminBtn" type="button" onclick="location.hash='#/account'; window.dispatchEvent(new Event('hashchange'))">♙ <span>Личный кабинет</span></button>
          <button class="text-btn" id="favoritesBtn" type="button">★ <span>Избранное</span><b id="favCount">0</b></button>
          <button class="icon-btn" id="themeBtn" type="button" aria-label="Сменить тему">◐</button>
        </div>
      </header>

      <main id="app" class="main" tabindex="-1">
        <div class="loading-screen">
          <div class="loader"></div>
          <p>Загружаем Книгу знаний…</p>
        </div>
      </main>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="versionModal" class="version-modal" hidden>
    <div class="version-backdrop" data-close-version></div>
    <section class="version-panel" role="dialog" aria-modal="true" aria-labelledby="versionTitle">
      <div class="version-head">
        <div>
          <span class="eyebrow">История обновлений</span>
          <h2 id="versionTitle">ver. log</h2>
        </div>
        <button class="icon-btn" type="button" data-close-version aria-label="Закрыть">×</button>
      </div>
      <div id="versionEntries" class="version-entries"></div>
    </section>
  </div>
  <div id="lightbox" class="lightbox" hidden>
    <button class="lightbox-close" type="button" aria-label="Закрыть">×</button>
    <button class="lightbox-prev" type="button" aria-label="Предыдущее изображение">‹</button>
    <img alt="">
    <button class="lightbox-next" type="button" aria-label="Следующее изображение">›</button>
  </div>

  <dialog id="docPreviewModal" class="doc-preview-modal" aria-labelledby="docPreviewTitle">
    <section class="doc-preview-shell">
      <header class="doc-preview-head">
        <div class="doc-preview-title-wrap">
          <span class="eyebrow">PDF · ПРЕДПРОСМОТР</span>
          <h2 id="docPreviewTitle">Документ</h2>
          <p id="docPreviewMeta">Встроенный просмотр нормативного документа</p>
        </div>
        <div class="doc-preview-actions">
          <a id="docPreviewDownload" class="btn primary" href="#" download>↓ Скачать PDF</a>
          <a id="docPreviewExternal" class="btn ghost" href="#" target="_blank" rel="noopener">↗ Открыть отдельно</a>
          <button id="docPreviewClose" class="icon-btn" type="button" aria-label="Закрыть предпросмотр">×</button>
        </div>
      </header>
      <div class="doc-preview-frame">
        <iframe id="docPreviewFrame" title="Предпросмотр PDF-документа" loading="lazy"></iframe>
      </div>
    </section>
  </dialog>

  <script type="module" src="./js/app.js?v=2.2.70"></script>
  <script type="module" src="./js/admin.js?v=2.2.70"></script>
</body>
</html>
