<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#335D42">
  <meta name="description" content="Книга знаний ТИАН-Трейд — единая внутренняя база товаров и решений.">
  <title>Книга знаний · ТИАН-Трейд</title>\n  <link rel="icon" type="image/svg+xml" href="./assets/brand/favicon.svg">\n  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Навигация по книге">
      <div class="brand">
        <button class="brand-home" id="brandHome" type="button" aria-label="На главную">
          <span class="brand-mark" aria-hidden="true"><img src="./assets/brand/favicon.svg" alt=""></span>
          <span class="brand-copy">
            <strong>ТИАН-Трейд</strong>
            <small>Книга знаний</small>
          </span>
        </button>
        <button class="icon-btn mobile-only" id="closeSidebar" type="button" aria-label="Закрыть меню">×</button>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <a class="diag-link" href="#/diagnostics">Диагностика данных</a>
        <span id="syncState" class="sync-state">Загрузка данных…</span>
      </div>
    </aside>

    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <div class="workspace">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="openSidebar" type="button" aria-label="Открыть меню">☰</button>
        <div class="search-wrap">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="globalSearch" class="search-input" type="search"
                 placeholder="Название, артикул, назначение…"
                 autocomplete="off" spellcheck="false">
          <kbd>Ctrl K</kbd>
          <div id="searchPanel" class="search-panel" hidden></div>
        </div>
        <div class="top-actions">
          <button class="text-btn" id="favoritesBtn" type="button">★ <span>Избранное</span><b id="favCount">0</b></button>
          <button class="text-btn" id="compareBtn" type="button">⇄ <span>Сравнить</span><b id="compareCount">0</b></button>
          <button class="icon-btn" id="themeBtn" type="button" aria-label="Сменить тему">◐</button>
        </div>
      </header>

      <main id="app" class="main" tabindex="-1">
        <div class="loading-screen">
          <div class="loader"></div>
          <p>Загружаем Книгу знаний…</p>
        </div>
      </main>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="lightbox" class="lightbox" hidden>
    <button class="lightbox-close" type="button" aria-label="Закрыть">×</button>
    <button class="lightbox-prev" type="button" aria-label="Предыдущее изображение">‹</button>
    <img alt="">
    <button class="lightbox-next" type="button" aria-label="Следующее изображение">›</button>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
